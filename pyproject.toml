[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jaunt-host"
version = "0.1.0b55"
description = "jaunt — your own shell, anywhere. Encrypted mobile remote terminals and files."
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = "MIT"
authors = [{name = "moukrea"}]
dependencies = [
  "websockets==16.0",
  "cryptography==50.0.1",
  "qrcode==8.2",
  "pywebpush==2.5.0",
]

[project.scripts]
jaunt = "jaunt.cli:main"

[tool.setuptools.packages.find]
where = ["host"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["host"]

[tool.setuptools.package-data]
jaunt = ["installer.sh", "locales/*.json"]
