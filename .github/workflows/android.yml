name: Android APK
on:
  pull_request:
    paths: ['android/**', 'web/**', 'scripts/prepare_web.mjs', 'tests/fixtures/update_channels.json', '.github/workflows/android.yml']
  push:
    branches: [main, 'android/**']
  workflow_call:
    inputs:
      ref:
        required: true
        type: string
      tag:
        required: true
        type: string
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0'
      - run: npm ci && npm run prepare-web
        env:
          jaunt_RELAY_URL: ${{ vars.jaunt_RELAY_URL }}
      - name: Test native protocol, lint and build APK
        run: android/gradlew -p android :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleDebugAndroidTest --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: android-validation
          path: |
            android/app/build/reports/tests/testDebugUnitTest/
            android/app/build/reports/lint-results-debug.html
      - name: Publish the debug APK for PR validation
        if: inputs.tag == ''
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
      - name: Sign and publish immutable Android release
        if: inputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          jaunt_ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          jaunt_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          export jaunt_ANDROID_KEYSTORE="$RUNNER_TEMP/jaunt-release.jks"
          trap 'rm -f "$jaunt_ANDROID_KEYSTORE"' EXIT
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$jaunt_ANDROID_KEYSTORE"
          chmod 600 "$jaunt_ANDROID_KEYSTORE"
          python3 - <<'PY'
          import os,re
          version=re.search(r"versionName '([^']+)'",open('android/app/build.gradle').read())[1]
          assert os.environ['TAG']=='android-v'+version, 'Tag/version mismatch'
          PY
          android/gradlew -p android :app:assembleRelease :app:lintRelease --no-daemon
          mkdir -p android-release
          cp android/app/build/outputs/apk/release/app-release.apk "android-release/jaunt-$TAG.apk"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "android-release/jaunt-$TAG.apk" > android-release/SIGNING-CERTIFICATE.txt
          (cd android-release && sha256sum -- *.apk SIGNING-CERTIFICATE.txt > SHA256SUMS)
      - name: Read trusted resumable publisher
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: release-control
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Publish or resume the frozen draft assets
        if: inputs.tag != ''
        run: python release-control/scripts/release_pipeline.py publish --directory android-release --component android --tag "$RELEASE_TAG"
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
