name: iOS bench
# The iOS bench for jaunt (ticket ops-0023; docs/IOS_BENCH.md, docs/IOS_BENCH_LIMITS.md): apple-bench.yml, the bench every product calls
# (step 6), with jaunt's inputs. On one of GitHub's macOS runners the source at `sha` builds the bench's test iPhone app (app/ios, Tauri
# 2) for the iOS simulator, unsigned and with no Apple account; the simulators the image has (the newest iPhone, an iPad, the oldest iOS
# runtime) boot one after the other, the app is installed and launched, an XCTest UI test (app/ios/driver) taps the app's page and
# types on its keyboard (step 1); a test jaunt machine runs on the same runner (the Rust host built for it, the test relay, the web
# client's page): the app opens the machine's page, and the UI test pairs with the machine by typing its code and waits until the app
# shows it connected (step 2), again with a machine reached over IPv6 only (step 3); a test notification is handed to the simulator
# (simctl push) and the UI test must see iOS show it (step 4). Then, on the same runner, the Tauri Mac app as a person gets it (step 5):
# the Experimental release's zip, else the one a release would carry, built here; quarantined, Gatekeeper's verdict, launched as after
# Open Anyway, its window and a screenshot, then quit. app/ios/bench.sh does each step, so the bench changes with the source, not here.
# Started by hand only: no other workflow names it, its concurrency group is its own, and nothing waits for it, so it never holds a
# Linux, Windows or Android release (docs/DEPLOYMENT.md "macOS is not required"). GitHub may not hand out a macOS runner: the bench's
# `watch` job starts this workflow once more (attempt 2) when none took the job within 30 minutes, and says so in its summary.
#   gh workflow run ios-bench.yml --repo moukrea/jaunt -f sha=<source commit with app/ios/bench.sh>
run-name: iOS bench ${{ inputs.sha }} (attempt ${{ inputs.attempt }})
on:
  workflow_dispatch:
    inputs:
      sha:
        description: 'Source commit to build (40 lowercase hexadecimal characters)'
        required: true
        type: string
      attempt:
        description: '1 when started by hand; 2 when the first attempt found no macOS runner and started this one'
        type: choice
        options: ['1', '2']
        default: '1'
permissions: {}
# It restores and saves nothing (cache-mode, enforced by GitHub's cache service; scripts/check_public_ops.py), nor does the bench.
cache-mode: none
# Its own group: a newer run for the same commit (the second attempt, or a new dispatch) replaces an older one, and no release or CI
# run shares it.
concurrency:
  group: ios-bench-${{ inputs.sha }}
  cancel-in-progress: true
jobs:
  # jaunt's source holds the bench: its own test app, test machine and Mac app (`bench`), the web client's words for the pairing.
  bench:
    uses: ./.github/workflows/apple-bench.yml
    permissions:
      contents: read
      actions: write
    with:
      product: jaunt
      repository: ${{ vars.JAUNT_SOURCE_REPO }}
      sha: ${{ inputs.sha }}
      attempt: ${{ inputs.attempt }}
      bundle-id: dev.jaunt.iosbench
      ios-build: bench
      machine: bench
      pair-field: Pairing string or link
      pair-button: Pair machine
      connected-text: Encrypted
      progress-texts: Local connection,Connecting,Verifying host
      devices: iphone,ipv6,ipad,oldest-ios
      notification: 'yes'
      mac: bench
      rust-toolchain: '1.91.1'
      tauri-cli: 2.12.4
      python-version: '3.13'
      node-version: '22'
    secrets:
      PRODUCT_SOURCE_KEY: ${{ secrets.SOURCE_READ_KEY }}
