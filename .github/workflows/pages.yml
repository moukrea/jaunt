name: Pages
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publish:
    if: vars.jaunt_RELAY_URL != ''
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: npm ci
      - run: npm run prepare-web
        env:
          jaunt_PRODUCTION: '1'
          jaunt_RELAY_URL: ${{ vars.jaunt_RELAY_URL }}
          jaunt_RELEASE_TAG: ${{ vars.jaunt_RELEASE_TAG }}
          jaunt_ANDROID_RELEASE_TAG: ${{ vars.jaunt_ANDROID_RELEASE_TAG }}
          jaunt_DESKTOP_RELEASE_TAG: ${{ vars.jaunt_DESKTOP_RELEASE_TAG }}
          jaunt_PAGE_URL: ${{ vars.jaunt_PAGE_URL }}
      - run: python scripts/check_project.py
      - name: Require published host assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=$(node -p "JSON.parse(require('fs').readFileSync('web/config.json')).release")
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern host-manifest.json --pattern SHA256SUMS --pattern 'jaunt_host-*.whl' --dir /tmp/jaunt-release
          python - <<'PYVERIFY'
          import hashlib,json,pathlib
          root=pathlib.Path('/tmp/jaunt-release')
          manifest=json.loads((root/'host-manifest.json').read_text())
          name=manifest['wheel']
          assert pathlib.Path(name).name==name
          assert hashlib.sha256((root/name).read_bytes()).hexdigest()==manifest['sha256']
          rows=(root/'SHA256SUMS').read_text().splitlines()
          assert len(rows)==2
          verified=set()
          for row in rows:
              digest,filename=row.split('  ',1)
              assert filename in {name,'host-manifest.json'}
              assert hashlib.sha256((root/filename).read_bytes()).hexdigest()==digest
              verified.add(filename)
          assert verified=={name,'host-manifest.json'}
          PYVERIFY
      - name: Require published Android assets when advertised
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=$(node -p "JSON.parse(require('fs').readFileSync('web/config.json')).androidRelease || ''")
          if [ -n "$TAG" ]; then
            gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern '*.apk' --pattern SHA256SUMS --pattern SIGNING-CERTIFICATE.txt --dir /tmp/jaunt-android-release
            python3 - <<'PYANDROID'
          import hashlib,pathlib
          root=pathlib.Path('/tmp/jaunt-android-release')
          rows=(root/'SHA256SUMS').read_text().splitlines()
          assert len(rows)==2
          seen=set()
          for row in rows:
              digest,name=row.split('  ',1)
              assert pathlib.Path(name).name==name and (name.endswith('.apk') or name=='SIGNING-CERTIFICATE.txt')
              assert hashlib.sha256((root/name).read_bytes()).hexdigest()==digest
              seen.add(name)
          assert len(seen)==2 and 'SIGNING-CERTIFICATE.txt' in seen
          PYANDROID
          fi
      - name: Require verified published desktop archive when advertised
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=$(node -p "JSON.parse(require('fs').readFileSync('web/config.json')).desktopRelease || ''")
          if [ -n "$TAG" ]; then
            gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern '*-x64.tar.gz' --pattern SHA256SUMS --dir /tmp/jaunt-desktop-release
            python3 - <<'PYDESKTOP'
          import hashlib,pathlib
          root=pathlib.Path('/tmp/jaunt-desktop-release')
          archive,=root.glob('*-x64.tar.gz')
          checks=dict(row.split('  ',1)[::-1] for row in (root/'SHA256SUMS').read_text().splitlines())
          assert hashlib.sha256(archive.read_bytes()).hexdigest()==checks[archive.name]
          PYDESKTOP
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - uses: actions/deploy-pages@v4
        id: deployment
