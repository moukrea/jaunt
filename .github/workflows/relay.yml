name: Relay
on:
  workflow_call:
    inputs:
      ref:
        required: true
        type: string
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: relay-production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm test && npm run test:relay
      - name: Require deployment authority
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: test -n "$CLOUDFLARE_API_TOKEN" && test -n "$CLOUDFLARE_ACCOUNT_ID"
      - name: Deploy Worker and Durable Object
        run: npx --no-install wrangler deploy --config relay/wrangler.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install 'aiohttp>=3.11,<4'
      - name: Read trusted publication probe
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: release-control
      - run: python release-control/scripts/release_pipeline.py relay-probe
        env:
          JAUNT_RELAY_URL: ${{ vars.JAUNT_RELAY_URL }}
