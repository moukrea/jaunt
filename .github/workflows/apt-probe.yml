# Probe: can GitHub's runners reach the Ubuntu package mirrors right now? Run it before dispatching CI after a mirror
# outage (15 jobs dying at status 124 in apt-get or playwright --with-deps): green = the mirrors answer; red = wait, do not
# rerun CI. It installs nothing and reads no secret.
name: apt-probe
on:
  workflow_dispatch:
permissions: {}
# (It caches nothing; the repository's workflows each state their cache access, scripts/check_public_ops.py.)
cache-mode: none
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    permissions: {}
    timeout-minutes: 4
    steps:
      - name: Serve the -security pocket from the runner's archive mirror (security.ubuntu.com unreachable; temporary, replaced by the lot-14 cache)
        run: |
          f=/etc/apt/sources.list.d/ubuntu.sources
          cat "$f"
          main=$(awk '/^URIs:/ && $2 !~ /security\.ubuntu\.com/ {print $2; exit}' "$f")
          echo "archive mirror: $main"
          sudo sed -i -E "s#https?://security\.ubuntu\.com/ubuntu/?#${main}#" "$f"
          grep -n '^URIs:' "$f"
      - name: apt-get update (90 s at most, any fetch error fails)
        run: |
          if timeout 90 sudo apt-get update -o APT::Update::Error-Mode=any -o Acquire::Retries=0; then
            echo "::notice::Ubuntu mirrors reachable from ${{ matrix.runner }}"
          else
            echo "::error::Ubuntu mirrors unreachable from ${{ matrix.runner }} (status $?): wait, do not rerun CI"
            exit 1
          fi
