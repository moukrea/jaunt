name: Host release
on:
  workflow_call:
    inputs:
      ref:
        required: true
        type: string
      tag:
        required: true
        type: string
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -e . -r requirements-dev.txt
      # The coordinator's own tests are control plane, validated by main CI; they
      # must not block a frozen release commit that carries older copies of them.
      - run: pytest -q --ignore=tests/test_release_pipeline.py
      - run: python scripts/build_release.py
      - name: Publish verified release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          python - "$TAG" <<'PY'
          import sys,tomllib
          from packaging.version import Version
          configured=tomllib.load(open('pyproject.toml','rb'))['project']['version']
          assert Version(sys.argv[1].removeprefix('v'))==Version(configured), 'Tag/package version mismatch'
          PY
      - name: Read trusted resumable publisher
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: release-control
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Publish or resume the frozen draft assets
        run: python release-control/scripts/release_pipeline.py publish --directory dist --component host --tag "$RELEASE_TAG"
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
