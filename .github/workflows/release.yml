name: Host release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to publish
        required: true
        type: string
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -e . -r requirements-dev.txt
      - run: pytest -q
      - run: python scripts/build_release.py
      - name: Publish verified release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          python - "$TAG" <<'PY'
          import sys,tomllib
          from packaging.version import Version
          configured=tomllib.load(open('pyproject.toml','rb'))['project']['version']
          assert Version(sys.argv[1].removeprefix('v'))==Version(configured), 'Tag/package version mismatch'
          PY
          FLAGS=()
          if [[ "$TAG" == *-* ]]; then FLAGS+=(--prerelease); fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo 'Release already exists; refusing to silently replace immutable artifacts.' >&2
            exit 1
          fi
          gh release create "$TAG" dist/*.whl dist/host-manifest.json dist/SHA256SUMS --verify-tag --title "jaunt $TAG" --notes-file docs/RELEASE_NOTES.md "${FLAGS[@]}"
