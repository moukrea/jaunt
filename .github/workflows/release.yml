name: Host release
# Called by auto-release.yml only. The builds (the desktop agent per platform, then the wheel) and
# the tests run the release commit's own code and dependencies with a read-only key they do not
# keep; the publisher installs nothing, so the read key it keeps (the publisher reads the ledger and
# the tag in the source) never meets third-party code.
on:
  workflow_call:
    inputs:
      ref:
        required: true
        type: string
      tag:
        required: true
        type: string
      control:
        description: Source main commit whose control scripts this run uses
        required: true
        type: string
      agents_from:
        description: 'A hotfix that changes nothing the desktop agent is built from: the published host tag whose agents it ships again, byte for byte (docs/DEPLOYMENT.md "Hotfix releases")'
        required: false
        type: string
        default: ''
      hotfix:
        description: 'A hotfix of maint/production (docs/DEPLOYMENT.md "Hotfix releases"): its tests run on the source''s own workflows, not main''s'
        required: false
        type: boolean
        default: false
    secrets:
      SOURCE_READ_KEY:
        required: true
permissions: {}
jobs:
  agent:
    # The desktop agent ships with the host (docs/DESKTOP.md, "Shipping"): built, tested and
    # smoke-tested per platform by the release commit's own agent/desktop/ci.sh (release mode), so
    # its build steps change with the source. A commit without that script ships no agent.
    # macOS never blocks a release (docs/DEPLOYMENT.md "macOS is not required"), and never waits for one either: it has no leg
    # here (a macOS runner may not be handed out for hours). release-macos.yml, which auto-release.yml starts beside this run, builds
    # it unwaited. The release goes out without a macOS agent; the other three are required (scripts/build_release.py refuses
    # a release without them).
    # A hotfix that reuses the agents of the release it fixes (agents_from) builds none.
    if: ${{ inputs.agents_from == '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux-x86_64
          - os: ubuntu-24.04-arm
            platform: linux-aarch64
          - os: windows-latest
            platform: windows-x86_64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ${{ vars.JAUNT_SOURCE_REPO }}
          ssh-key: ${{ secrets.SOURCE_READ_KEY }}
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - id: crate
        shell: bash
        run: if [ -f agent/desktop/ci.sh ]; then echo present=true >> "$GITHUB_OUTPUT"; else echo present=false >> "$GITHUB_OUTPUT"; echo "No desktop agent in this commit"; fi
      - if: steps.crate.outputs.present == 'true'
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
        run: bash agent/desktop/ci.sh "$PLATFORM" release
      - if: steps.crate.outputs.present == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: host-agent-${{ matrix.platform }}
          path: dist/agent-release/
          if-no-files-found: error
          retention-days: 1
      # The Rust host, its launcher and the terminal emulator library, for an Experimental build only (docs/RUST_HOST.md, "The switch
      # under the Canary freeze"): a Canary, a Latest and a channel candidate run none of the three steps, so their jobs, matrix and
      # manifest are what they were (tests/test_release_workflow.py holds that). Linux only; a commit without the script ships none.
      - id: rust
        if: ${{ startsWith(matrix.platform, 'linux-') }}
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
        run: |
          if [[ "$TAG" =~ ^host-[0-9]+\.[0-9]+\.[0-9]+-exp\.[0-9]+$ ]] && [ -f scripts/rust_release.sh ]; then echo wanted=true >> "$GITHUB_OUTPUT"; else echo wanted=false >> "$GITHUB_OUTPUT"; fi
      - if: ${{ steps.rust.outputs.wanted == 'true' }}
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
        run: if [ -f scripts/rust_release.sh ]; then bash scripts/rust_release.sh "$PLATFORM"; fi
      - if: ${{ steps.rust.outputs.wanted == 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: host-rust-${{ matrix.platform }}
          path: dist/rust-release/
          if-no-files-found: error
          retention-days: 1
  build:
    needs: agent
    if: ${{ !cancelled() && (needs.agent.result == 'success' || (needs.agent.result == 'skipped' && inputs.agents_from != '')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ${{ vars.JAUNT_SOURCE_REPO }}
          ssh-key: ${{ secrets.SOURCE_READ_KEY }}
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      # The tools that make the wheel, each file by its SHA-256 (a source from before that lock: as before).
      - run: |
          if [ -f .github/build-requirements.txt ]; then
            python -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r .github/build-requirements.txt
          else
            pip install -e . -r requirements-dev.txt
          fi
      - id: crate
        run: if [ -f agent/desktop/ci.sh ]; then echo present=true >> "$GITHUB_OUTPUT"; else echo present=false >> "$GITHUB_OUTPUT"; fi
      - if: steps.crate.outputs.present == 'true' && inputs.agents_from == ''
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: host-agent-*
          path: dist-agents
          merge-multiple: true
      # A hotfix (agents_from): the agents of the release it fixes, checked against that release's manifest and checksums by main's
      # release tooling (a copy of its own, removed before the build runs), instead of a build of the same agent source.
      - if: steps.crate.outputs.present == 'true' && inputs.agents_from != ''
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ${{ vars.JAUNT_SOURCE_REPO }}
          ssh-key: ${{ secrets.SOURCE_READ_KEY }}
          ref: ${{ inputs.control }}
          path: .reuse
          persist-credentials: false
      - if: steps.crate.outputs.present == 'true' && inputs.agents_from != ''
        env:
          GH_TOKEN: ${{ github.token }}
          JAUNT_RELEASE_REPOSITORY: ${{ github.repository }}
          AGENTS_FROM: ${{ inputs.agents_from }}
        run: |
          python .reuse/scripts/release_pipeline.py reuse-agents --tag "$AGENTS_FROM" --directory dist-agents
          rm -rf .reuse
      # An Experimental build of a source with the Rust host publishes it for both Linux platforms (build_release.py refuses one
      # missing, and refuses it for any other build).
      - id: rust
        env:
          TAG: ${{ inputs.tag }}
        run: |
          if [[ "$TAG" =~ ^host-[0-9]+\.[0-9]+\.[0-9]+-exp\.[0-9]+$ ]] && [ -f scripts/rust_release.sh ]; then echo wanted=true >> "$GITHUB_OUTPUT"; else echo wanted=false >> "$GITHUB_OUTPUT"; fi
      - if: ${{ steps.rust.outputs.wanted == 'true' }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: host-rust-*
          path: dist-rust
          merge-multiple: true
      # A source with the agent publishes it for every platform (build_release.py refuses one missing).
      - env:
          AGENTS: ${{ steps.crate.outputs.present }}
          RUST: ${{ steps.rust.outputs.wanted }}
        run: |
          args=()
          if [ "$AGENTS" = true ]; then args+=(--agents dist-agents); fi
          if [ "$RUST" = true ]; then args+=(--rust dist-rust); fi
          python scripts/build_release.py "${args[@]}"
      - name: Read trusted resumable publisher
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ${{ vars.JAUNT_SOURCE_REPO }}
          ssh-key: ${{ secrets.SOURCE_READ_KEY }}
          ref: ${{ inputs.control }}
          path: .control
          persist-credentials: false
      - name: Require the tag's version in the package
        env:
          TAG: ${{ inputs.tag }}
        run: |
          python - "$TAG" <<'PY'
          import sys,tomllib
          from packaging.version import Version
          # The trusted copy maps production and channel candidate tags to PEP 440.
          sys.path.insert(0,'.control/scripts')
          import update_channels
          configured=tomllib.load(open('pyproject.toml','rb'))['project']['version']
          assert Version(update_channels.python_version(sys.argv[1]))==Version(configured), 'Tag/package version mismatch'
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: host-release
          path: dist/
          if-no-files-found: error
          retention-days: 1
  # The release commit's tests, beside the agent builds instead of after them (they took 9 of the
  # release's 24 minutes in October 2026): publish waits for both.
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # A hotfix also fetches the release commit's parent: the source, whose own workflows its tests compare with its ops/public.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ${{ vars.JAUNT_SOURCE_REPO }}
          ssh-key: ${{ secrets.SOURCE_READ_KEY }}
          ref: ${{ inputs.ref }}
          fetch-depth: ${{ inputs.hotfix && 2 || 1 }}
          persist-credentials: false
      # The release commit carries main's .github/workflows (GitHub refuses a tag whose workflows differ from main's), and a source's
      # tests check its ops/public against its own: a hotfix of an older source differs from main by construction (beta.383 failed
      # here on a suite main added to its CI). The same step, word for word, runs in hotfix-check.yml's test job.
      - name: A hotfix tests its own workflows
        if: ${{ inputs.hotfix }}
        run: |
          git rm -rfq .github/workflows
          git checkout -q HEAD^ -- .github/workflows
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - run: pip install -e . -r requirements-dev.txt
      # The coordinator's own tests are control plane, validated by main CI; they
      # must not block a frozen release commit that carries older copies of them.
      - run: pytest -q --ignore=tests/test_release_pipeline.py
        env:
          PYTEST_ADDOPTS: --tb=line
  publish:
    needs: [build, test]
    # Explicit: with agents_from the agent job is skipped, and a skipped job earlier in the chain would skip this one.
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.test.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      JAUNT_RELEASE_REPOSITORY: ${{ github.repository }}
      JAUNT_RELEASE_TARGET: main
    steps:
      # Kept key: publish reads the release ledger and fetches the tag from the source.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ${{ vars.JAUNT_SOURCE_REPO }}
          ssh-key: ${{ secrets.SOURCE_READ_KEY }}
          ref: ${{ inputs.ref }}
      - name: Read trusted resumable publisher
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ${{ vars.JAUNT_SOURCE_REPO }}
          ssh-key: ${{ secrets.SOURCE_READ_KEY }}
          ref: ${{ inputs.control }}
          path: .control
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: host-release
          path: dist
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - name: Publish or resume the frozen draft assets
        run: python .control/scripts/release_pipeline.py publish --directory dist --component host --tag "$RELEASE_TAG"
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
