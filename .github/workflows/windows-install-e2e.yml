# The Windows install end to end, on its own: ci.yml's `windows` job reduced to the one step that needs a Windows machine and a fresh
# certificate store (tests/windows_install_e2e.py: install.ps1, the host, the update, and on a runner the tester's TLS state: the
# root of github.com missing, Windows' root updates refused). Same checkout of the private source (same key, same read-only
# permissions) and the same steps as that job; it is not a substitute for "CI main <commit>", which the release queue still requires.
#   gh workflow run windows-install-e2e.yml --repo moukrea/jaunt -f sha=<commit of the source>
run-name: Windows install e2e ${{ inputs.sha }} python ${{ inputs.python }}
name: windows-install-e2e
on:
  workflow_dispatch:
    inputs:
      sha:
        description: 'Source commit to test (40 lowercase hexadecimal characters)'
        required: true
        type: string
      python:
        description: 'Python for the job (3.11.9 is python.org''s the tester runs, whose OpenSSL 3.0 fails where 3.13''s does not)'
        required: false
        default: '3.13'
        type: string
permissions: {}
# No Actions cache, neither restored nor saved (cache-mode, enforced by GitHub's cache service): a probe needs none, and every
# run here is on main, whose cache every later run on main restores (ci/cache-mode, scripts/check_public_ops.py there).
cache-mode: none
concurrency:
  group: windows-install-e2e-${{ inputs.sha }}-${{ inputs.python }}
  cancel-in-progress: false
jobs:
  guard:
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Require an exact source commit
        env:
          SHA: ${{ inputs.sha }}
        run: |
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "sha must be a full commit id (40 lowercase hexadecimal characters)"; exit 1; }
  windows:
    needs: guard
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      RUSTUP_TOOLCHAIN: '1.91.1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ${{ vars.JAUNT_SOURCE_REPO }}
          ssh-key: ${{ secrets.SOURCE_READ_KEY }}
          ref: ${{ inputs.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ inputs.python }}
      - run: pip install -e . -r requirements-dev.txt
      - name: The Rust programs, as the release builds them
        shell: bash
        timeout-minutes: 25
        run: |
          if [ -f scripts/rust_release.sh ]; then
            rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
            bash scripts/rust_release.sh windows-x86_64
          else
            echo 'No Rust programs in this source'
          fi
      - run: python tests/windows_install_e2e.py
        timeout-minutes: 20
