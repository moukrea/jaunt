name: Desktop app
on:
  pull_request:
    paths: ['desktop/**', 'web/**', 'package*.json', 'scripts/check_desktop_package.mjs', 'scripts/prepare_web.mjs', '.github/workflows/desktop.yml']
  workflow_call:
    inputs:
      ref:
        required: true
        type: string
      tag:
        required: true
        type: string
permissions:
  contents: read
jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            targets: --linux tar.gz deb rpm --x64 --arm64
          - os: macos-latest
            targets: --mac zip dmg --x64 --arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: node --test tests/desktop_updates.test.cjs
      - run: npm run prepare-web
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y rpm
      - run: npx electron-builder ${{ matrix.targets }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - run: node scripts/check_desktop_package.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ runner.os }}
          path: |
            dist/desktop/*.tar.gz
            dist/desktop/*.deb
            dist/desktop/*.rpm
            dist/desktop/*.zip
            dist/desktop/*.dmg
          if-no-files-found: error
  publish:
    if: inputs.tag != ''
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          merge-multiple: true
          path: desktop-release
      - name: Publish immutable desktop packages
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          node -e 'if(process.env.TAG!=="desktop-v"+require("./package.json").version)throw Error("Tag/version mismatch")'
          (cd desktop-release && sha256sum -- * > SHA256SUMS)
      - name: Read trusted resumable publisher
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: release-control
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Publish or resume the frozen draft assets
        run: python release-control/scripts/release_pipeline.py publish --directory desktop-release --component desktop --tag "$RELEASE_TAG"
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
