name: Desktop app
# Called by auto-release.yml only. Builds keep no key; the publisher keeps the read key (it reads the
# ledger and the tag in the source) and installs nothing.
# While computers move from the Electron app to the Tauri app, a release may carry two sets of names
# (scripts/desktop_assets.py, docs/DEPLOYMENT.md "Desktop: the Electron bridge pin"): plan reads the
# source's pin (desktop/bridge.json). Without one (every source before the move, and any older source
# the release queue still publishes) only the Electron build runs, as it always did.
on:
  workflow_call:
    inputs:
      ref:
        required: true
        type: string
      tag:
        required: true
        type: string
      control:
        description: Source main commit whose control scripts this run uses
        required: true
        type: string
    secrets:
      SOURCE_READ_KEY:
        required: true
permissions: {}
jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      electron: ${{ steps.plan.outputs.electron }}
      bridge: ${{ steps.plan.outputs.bridge }}
      app: ${{ steps.plan.outputs.app }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ${{ vars.JAUNT_SOURCE_REPO }}
          ssh-key: ${{ secrets.SOURCE_READ_KEY }}
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - id: plan
        run: |
          if [ -f scripts/desktop_assets.py ]; then
            python scripts/desktop_assets.py plan >> "$GITHUB_OUTPUT"
          else
            printf 'electron=true\nbridge=false\napp=[]\n' >> "$GITHUB_OUTPUT"
          fi
  build:
    needs: plan
    if: needs.plan.outputs.electron == 'true'
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            targets: --linux tar.gz deb rpm --x64 --arm64
          - os: macos-latest
            targets: --mac zip dmg --x64 --arm64
          - os: windows-latest
            targets: --win nsis --x64 --arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ${{ vars.JAUNT_SOURCE_REPO }}
          ssh-key: ${{ secrets.SOURCE_READ_KEY }}
          ref: ${{ inputs.ref }}
          persist-credentials: false
      # The release queue publishes older commits too: one from before Windows support has no
      # Windows build, and this job then produces nothing for it.
      - id: support
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Windows ] && ! grep -q '"win"' package.json; then echo build=false >> "$GITHUB_OUTPUT"; else echo build=true >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: steps.support.outputs.build == 'true'
        with:
          node-version: '22'
      - if: steps.support.outputs.build == 'true'
        run: npm ci
      - if: steps.support.outputs.build == 'true'
        run: node --test tests/desktop_updates.test.cjs
      - if: steps.support.outputs.build == 'true'
        run: npm run prepare-web
      - if: steps.support.outputs.build == 'true' && (runner.os == 'Linux')
        run: sudo apt-get update && sudo apt-get install -y rpm
      - if: steps.support.outputs.build == 'true' && (runner.os == 'Windows')
        shell: bash
        run: node --check desktop/main.cjs
      - if: steps.support.outputs.build == 'true'
        run: npx electron-builder ${{ matrix.targets }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - if: steps.support.outputs.build == 'true'
        run: node scripts/check_desktop_package.mjs
      - if: steps.support.outputs.build == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: desktop-${{ runner.os }}
          path: |
            dist/desktop/*.tar.gz
            dist/desktop/*.deb
            dist/desktop/*.rpm
            dist/desktop/*.zip
            dist/desktop/*.dmg
            dist/desktop/*.exe
          if-no-files-found: error
          retention-days: 1
  # The legacy names carry the pinned bridge's very bytes: downloaded from its public release, each checked against
  # the SHA-256 the pin holds, renamed to this release's version.
  bridge:
    needs: plan
    if: needs.plan.outputs.bridge == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ${{ vars.JAUNT_SOURCE_REPO }}
          ssh-key: ${{ secrets.SOURCE_READ_KEY }}
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - run: |
          if [ -f scripts/desktop_assets.py ]; then python scripts/desktop_assets.py bridge --out dist/desktop; else exit 1; fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: desktop-bridge
          path: dist/desktop/*
          if-no-files-found: error
          retention-days: 1
  # The Tauri app (app/) for the platforms the pin names, under its jaunt-app names.
  app:
    needs: plan
    if: needs.plan.outputs.app != '[]'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.app) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    env:
      RUSTUP_TOOLCHAIN: '1.91.1'
      TAURI_CLI_VERSION: 2.12.4
      PLATFORM: ${{ matrix.platform }}
      ARCH: ${{ matrix.arch }}
      TARGET: ${{ matrix.target }}
      BUNDLES: ${{ matrix.bundles }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ${{ vars.JAUNT_SOURCE_REPO }}
          ssh-key: ${{ secrets.SOURCE_READ_KEY }}
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - run: npm ci
      - run: npm run prepare-web
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev librsvg2-dev rpm
      - name: Rust (pinned) and the Tauri CLI (pinned)
        run: |
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --target "$TARGET"
          cargo install tauri-cli --version "$TAURI_CLI_VERSION" --locked
      # The same commands as ci.yml's app-package job, which builds and checks the packages before a release does. Linux: the
      # executable is built with its real version, then bundled with + for the - of a pre-release (the rpm bundler refuses a -, the
      # CLI's config takes semver only); the staging writes ~ instead (scripts/desktop_assets.py), as the Electron app's packages
      # had, so that a final release orders above its betas; scripts/check_app_package.mjs holds the result to that.
      - name: Build
        working-directory: app
        run: |
          if [ "$PLATFORM" = linux ]; then
            cargo tauri build --ci --target "$TARGET" --no-bundle -- --locked
            VERSION=$(node -p 'require("../package.json").version.replace("-", "+")')
            cargo tauri bundle --ci --target "$TARGET" --bundles "$BUNDLES" --config "{\"version\":\"$VERSION\"}"
          else
            cargo tauri build --ci --target "$TARGET" --bundles "$BUNDLES" -- --locked
          fi
      - name: Stage under the jaunt-app names
        run: |
          if [ -f scripts/desktop_assets.py ]; then python scripts/desktop_assets.py app --platform "$PLATFORM" --arch "$ARCH" --bundle "app/target/$TARGET/release" --out dist/desktop; else exit 1; fi
      # What a person installs, inspected as it is (scripts/check_app_package.mjs): not published if it is wrong. A source before the
      # check has none, and builds as it did.
      - name: Check the packages
        run: if [ -f scripts/check_app_package.mjs ]; then node scripts/check_app_package.mjs dist/desktop; fi
      - name: Install, update and uninstall the Windows installer
        if: runner.os == 'Windows' && matrix.arch == 'x64'
        env:
          JAUNT_PACKAGE_INSTALL_TEST: '1'
        run: if [ -f scripts/check_app_package.mjs ]; then node scripts/check_app_package.mjs --install-windows dist/desktop/jaunt-app-*-x64.exe; fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: desktop-app-${{ matrix.platform }}-${{ matrix.arch }}
          path: dist/desktop/*
          if-no-files-found: error
          retention-days: 1
  publish:
    if: ${{ !cancelled() && inputs.tag != '' && needs.plan.result == 'success' && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
    needs: [plan, build, bridge, app]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      JAUNT_RELEASE_REPOSITORY: ${{ github.repository }}
      JAUNT_RELEASE_TARGET: main
    steps:
      # Kept key: publish reads the release ledger and fetches the tag from the source.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ${{ vars.JAUNT_SOURCE_REPO }}
          ssh-key: ${{ secrets.SOURCE_READ_KEY }}
          ref: ${{ inputs.ref }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: desktop-*
          merge-multiple: true
          path: desktop-release
      - name: Publish immutable desktop packages
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          node -e 'const v=require("./package.json").version;if(process.env.TAG!=="desktop-v"+v&&process.env.TAG!=="desktop-"+v)throw Error("Tag/version mismatch")'
          (cd desktop-release && sha256sum -- * > SHA256SUMS)
      - name: Read trusted resumable publisher
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ${{ vars.JAUNT_SOURCE_REPO }}
          ssh-key: ${{ secrets.SOURCE_READ_KEY }}
          ref: ${{ inputs.control }}
          path: .control
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - name: Publish or resume the frozen draft assets
        run: python .control/scripts/release_pipeline.py publish --directory desktop-release --component desktop --tag "$RELEASE_TAG"
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
