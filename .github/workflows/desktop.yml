name: Desktop app
on:
  pull_request:
    paths: ['desktop/**', 'web/**', 'package*.json', '.github/workflows/desktop.yml']
  push:
    tags: ['desktop-v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            targets: --linux tar.gz deb rpm --x64 --arm64
          - os: macos-latest
            targets: --mac zip dmg --x64 --arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run prepare-web
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y rpm
      - run: npx electron-builder ${{ matrix.targets }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ runner.os }}
          path: |
            dist/desktop/*.tar.gz
            dist/desktop/*.deb
            dist/desktop/*.rpm
            dist/desktop/*.zip
            dist/desktop/*.dmg
          if-no-files-found: error
  publish:
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          merge-multiple: true
          path: desktop-release
      - name: Publish immutable desktop packages
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          node -e 'if(process.env.TAG!=="desktop-v"+require("./package.json").version)throw Error("Tag/version mismatch")'
          (cd desktop-release && sha256sum * > SHA256SUMS)
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo 'Refusing to replace a desktop release.' >&2
            exit 1
          fi
          gh release create "$TAG" desktop-release/* --verify-tag --prerelease --title "jaunt desktop ${TAG#desktop-v}" --notes-file docs/DESKTOP_RELEASE_NOTES.md
