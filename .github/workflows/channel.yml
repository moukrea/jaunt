name: Channel release
run-name: Channel ${{ inputs.action }} ${{ inputs.pr }} ${{ inputs.sha }}
# Publishes the candidate of a pull request of the private source on its update channel
# <dispatcher>_<pr> (docs/UPDATES.md#update-channels), removes it again, or publishes a build of
# a branch of the source on the Experimental channel. Started by hand only, on main, by someone who
# can write here: that is the authority over what a channel installs, since the token of this
# repository cannot read the source's pull requests.
#   publish:      gh workflow run channel.yml --repo moukrea/jaunt -f pr=<n> -f sha=<head commit> [-f title=<text>]
#   cleanup:      gh workflow run channel.yml --repo moukrea/jaunt -f action=cleanup -f pr=<n>
#   experimental: gh workflow run channel.yml --repo moukrea/jaunt -f action=experimental -f sha=<branch tip> [-f title=<text>]
# `prepare` (ledger environment, the ledger key, installs nothing) proves over the deploy key that the
# head is what the source's refs/pull/<n>/head names and the tip of one of its branches (an
# Experimental build: the tip of one of its branches, which also needs a green CI run of that head, or of
# a commit of the same tree, whose Rust host conformance step succeeded), then reserves the build and pushes its three
# tags with the reservation (`-exp.N` tags for Experimental). The three builds are the release
# workflows the queue calls (keyless; Android is signed in the `release` environment with the pinned
# signer); `record` (ledger) verifies the three prereleases and marks the candidate delivered. Then `pages`
# (after `record` and after `cleanup`) calls pages.yml with `plan`: it redeploys the last delivered production
# with the live channels, so that the channel page changes whether or not auto-release.yml is enabled, and
# `verify-pages` (ledger) checks the public index. This workflow never takes the production lock: the Pages
# run queues in pages.yml's own group, behind a deployment in flight, and decides what to deploy only then.
on:
  workflow_dispatch:
    inputs:
      action:
        description: publish a pull request candidate, cleanup the channel of a closed pull request, or publish a branch tip on Experimental
        type: choice
        options: [publish, cleanup, experimental]
        default: publish
      pr:
        description: Pull request number in the source (publish, cleanup; not experimental)
        required: false
        type: string
      sha:
        description: Head commit of the pull request (publish) or tip of a source branch (experimental)
        required: false
        type: string
      title:
        description: Title shown in the channel list (publish and experimental, optional)
        required: false
        type: string
# One lane per pull request, and one for Experimental: a run waits for the previous one of its lane.
concurrency:
  group: jaunt-channel-${{ inputs.action == 'experimental' && 'experimental' || inputs.pr }}
  cancel-in-progress: false
permissions: {}
# No Actions cache, neither restored nor saved (cache-mode, enforced by GitHub's cache service): a release, or a workflow
# holding more than the source read key, never takes files another run saved (scripts/check_public_ops.py).
cache-mode: none
env:
  JAUNT_RELEASE_REPOSITORY: ${{ github.repository }}
jobs:
  prepare:
    # The ledger and release environments are restricted to main; so is the dispatch.
    if: github.ref == 'refs/heads/main' && (inputs.action == 'publish' || inputs.action == 'experimental')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ledger
    permissions:
      contents: read
      # An Experimental build is refused without a green CI run whose Rust conformance step succeeded (scripts/channel_release.py): the
      # runs and their steps are read here, with this token, in this repository.
      actions: read
    outputs:
      publish: ${{ steps.prepare.outputs.publish || steps.experimental.outputs.publish }}
      sha: ${{ steps.prepare.outputs.sha || steps.experimental.outputs.sha }}
      control: ${{ steps.control.outputs.sha }}
      host: ${{ steps.prepare.outputs.host || steps.experimental.outputs.host }}
      desktop: ${{ steps.prepare.outputs.desktop || steps.experimental.outputs.desktop }}
      android: ${{ steps.prepare.outputs.android || steps.experimental.outputs.android }}
      host_tag: ${{ steps.prepare.outputs.host_tag || steps.experimental.outputs.host_tag }}
      desktop_tag: ${{ steps.prepare.outputs.desktop_tag || steps.experimental.outputs.desktop_tag }}
      android_tag: ${{ steps.prepare.outputs.android_tag || steps.experimental.outputs.android_tag }}
      # Only an Experimental build has them (the CI run of its tree ran the suite): the builds skip what they say was proved.
      proven_host: ${{ steps.experimental.outputs.proven_host }}
      proven_android: ${{ steps.experimental.outputs.proven_android }}
    steps:
      # The ledger key may push to the source: this job runs control code only (main) and installs nothing.
      # It reads the pull request's objects, never runs them.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ${{ vars.JAUNT_SOURCE_REPO }}
          ssh-key: ${{ secrets.SOURCE_LEDGER_KEY }}
          ref: main
          fetch-depth: 0
      - id: control
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      # The workflows this run calls (release, desktop, android, pages) and this one are THIS repository's, which scripts/sync_public_ops.sh
      # copies from source main's ops/public: a copy older than main's is not what the lot was written against. Experimental 14 compiled the
      # Tauri CLI for 11.5 minutes because the public desktop.yml did not have the download main had had for a day. Refused before anything
      # is reserved or built, naming the files.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          path: .dist
          persist-credentials: false
      - name: This repository's workflows are source main's
        run: |
          stale=
          for name in channel release desktop android pages; do
            cmp -s ".dist/.github/workflows/$name.yml" "ops/public/.github/workflows/$name.yml" || stale="$stale $name.yml"
          done
          if [ -n "$stale" ]; then
            echo "::error title=Public workflows older than source main::${stale# } differ from ops/public of source main: sync the public workflows (sync_public_ops), then dispatch again"
            exit 1
          fi
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - name: Verify the head and reserve the candidate
        id: prepare
        if: inputs.action == 'publish'
        run: |
          if [ ! -f scripts/channel_release.py ]; then echo 'This source has no channel publisher'; exit 1; fi
          python scripts/channel_release.py prepare --pr "$PR" --sha "$HEAD_SHA" --title "$TITLE"
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ inputs.pr }}
          HEAD_SHA: ${{ inputs.sha }}
          TITLE: ${{ inputs.title }}
      - name: Verify the branch tip and reserve the Experimental build
        id: experimental
        if: inputs.action == 'experimental'
        run: |
          if [ ! -f scripts/channel_release.py ]; then echo 'This source has no channel publisher'; exit 1; fi
          python scripts/channel_release.py experimental --sha "$HEAD_SHA" --title "$TITLE"
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ inputs.sha }}
          TITLE: ${{ inputs.title }}
  host:
    needs: prepare
    if: needs.prepare.outputs.host == 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      ref: ${{ needs.prepare.outputs.sha }}
      tag: ${{ needs.prepare.outputs.host_tag }}
      control: ${{ needs.prepare.outputs.control }}
      tests_proven: ${{ needs.prepare.outputs.proven_host == 'true' }}
    secrets:
      SOURCE_READ_KEY: ${{ secrets.SOURCE_READ_KEY }}
  desktop:
    needs: prepare
    if: needs.prepare.outputs.desktop == 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/desktop.yml
    with:
      ref: ${{ needs.prepare.outputs.sha }}
      tag: ${{ needs.prepare.outputs.desktop_tag }}
      control: ${{ needs.prepare.outputs.control }}
    secrets:
      SOURCE_READ_KEY: ${{ secrets.SOURCE_READ_KEY }}
  android:
    needs: prepare
    if: needs.prepare.outputs.android == 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/android.yml
    with:
      ref: ${{ needs.prepare.outputs.sha }}
      tag: ${{ needs.prepare.outputs.android_tag }}
      control: ${{ needs.prepare.outputs.control }}
      tests_proven: ${{ needs.prepare.outputs.proven_android == 'true' }}
    # Its build reads the release environment's signing secrets, which GitHub hands to a called
    # workflow only through inherit (the repository-level secret inherited is SOURCE_READ_KEY).
    secrets: inherit
  record:
    needs: [prepare, host, desktop, android]
    if: always() && needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ledger
    permissions:
      contents: read
    outputs:
      control: ${{ needs.prepare.outputs.control }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ${{ vars.JAUNT_SOURCE_REPO }}
          ssh-key: ${{ secrets.SOURCE_LEDGER_KEY }}
          ref: ${{ needs.prepare.outputs.control }}
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - name: Verify the three prereleases and record the build
        if: ${{ !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
        run: |
          if [ ! -f scripts/channel_release.py ]; then echo 'This source has no channel publisher'; exit 1; fi
          python scripts/channel_release.py record --sha "$RELEASE_SHA"
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ needs.prepare.outputs.sha }}
      - name: Retain the failed candidate for a rerun
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          if [ ! -f scripts/channel_release.py ]; then echo 'This source has no channel publisher'; exit 1; fi
          python scripts/channel_release.py failed --sha "$RELEASE_SHA"
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ needs.prepare.outputs.sha }}
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
  cleanup:
    if: github.ref == 'refs/heads/main' && inputs.action == 'cleanup'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ledger
    permissions:
      contents: write
    outputs:
      control: ${{ steps.control.outputs.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ${{ vars.JAUNT_SOURCE_REPO }}
          ssh-key: ${{ secrets.SOURCE_LEDGER_KEY }}
          ref: main
          fetch-depth: 0
      - id: control
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - name: Delete the channel's prereleases, tags and entry
        run: |
          if [ ! -f scripts/channel_release.py ]; then echo 'This source has no channel publisher'; exit 1; fi
          python scripts/channel_release.py cleanup --pr "$PR"
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ inputs.pr }}
  # The channel page: the same Pages deployment auto-release.yml makes (pages.yml: production at the root, ch/<name>/ for each live channel,
  # ch/index.json), made here so that it does not depend on auto-release.yml being enabled. `plan` decides, inside pages.yml's lock, whether
  # anything is to be deployed: nothing when the public index already shows the live channels or a production publication is pending (that
  # run deploys them). It also runs for an Experimental or candidate build that was already delivered (publish=false), so that a page
  # that never got the build is made on the next dispatch. No `concurrency` here: pages.yml's own group would then wait for this job.
  pages:
    needs: [prepare, record, cleanup]
    if: >-
      always() && (needs.record.result == 'success' || needs.cleanup.result == 'success' ||
      (needs.prepare.result == 'success' && needs.prepare.outputs.publish == 'false'))
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
    with:
      plan: true
      control: ${{ needs.record.outputs.control || needs.cleanup.outputs.control || needs.prepare.outputs.control }}
    # Like auto-release.yml's: pages.yml has an environment job, which GitHub hands secrets to only through inherit.
    secrets: inherit
  # The reads wait for a Page that is not answering yet (at most 10 min, scripts/release_pipeline.py wait_for_pages) and for a CDN edge that still holds an
  # older file (12 min): the job's limit holds both, one after the other, and a margin (tests/test_pages_wait.py holds every such job to that).
  verify-pages:
    needs: [pages, prepare, record, cleanup]
    # Only when a site was deployed (pages.yml's `channels` output is empty when `plan` found nothing to do).
    if: always() && needs.pages.result == 'success' && needs.pages.outputs.channels != ''
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: ledger
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ${{ vars.JAUNT_SOURCE_REPO }}
          ssh-key: ${{ secrets.SOURCE_LEDGER_KEY }}
          ref: ${{ needs.record.outputs.control || needs.cleanup.outputs.control || needs.prepare.outputs.control }}
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - name: Verify the public channel pages
        run: |
          if [ ! -f scripts/channel_site.py ]; then echo 'This source has no channel site publisher'; exit 1; fi
          python scripts/channel_site.py verify
        env:
          GH_TOKEN: ${{ github.token }}
          CHANNELS: ${{ needs.pages.outputs.channels }}
          DROPPED: ${{ needs.pages.outputs.dropped }}
          JAUNT_PAGE_URL: ${{ vars.JAUNT_PAGE_URL }}
