name: Invite a tester
# Owner tool: create, list, rekey or revoke a tester invite on the relay, move one room to another invite (reassign), or read the relay's live admin
# state (status: quota.status, flags.get, certs.quota), a room's or an invite's connection log (connlog)
# or an invite's account budgets (account); both read-only. Job logs, summaries and artifacts are public,
# so the script prints no key and no tester name: create, list, rekey, reassign, status, connlog, account and exemptions are encrypted with age to
# the repository variable OWNER_PUBLIC_KEY (an age or SSH public key) and refused without it; revoke
# and exempt (the early-access exemption) print ids only. each of those is also kept, encrypted, as the one-day artifact relay-status (gh run
# download). The inputs are read from the event file by the script, never interpolated into a command.
on:
  workflow_dispatch:
    inputs:
      action:
        description: 'create, list, rekey, revoke, status, connlog, account, reassign, exemptions or exempt'
        type: choice
        options: [list, create, rekey, revoke, status, connlog, account, reassign, exemptions, exempt]
        default: list
      name:
        description: "create: the tester's name (not printed; still run metadata, so a first name or a pseudonym)"
        required: false
        default: ''
      max_hosts:
        description: 'create: how many machines the key may register (1-100)'
        required: false
        default: '10'
      id:
        description: "revoke, rekey, account, connlog: the invite id (inv-...); connlog takes this or room; exempt: an invite id or early-access (testers and early-access accounts); reassign: the TARGET invite id (inv-..., valid) or none (an owner's room)"
        required: false
        default: ''
      room:
        description: 'connlog: a room id (24 characters) instead of an invite id; reassign: the one room to move (not printed; still run metadata)'
        required: false
        default: ''
      from:
        description: 'connlog: first UTC day, YYYY-MM-DD (default: 3 days up to "to")'
        required: false
        default: ''
      to:
        description: 'connlog: last UTC day, YYYY-MM-DD (default: today; at most 31 days from "from")'
        required: false
        default: ''
      until:
        description: 'create, exempt: the early-access exemption lasts until this date (default 2099-12-31)'
        required: false
        default: ''
      force:
        description: 'rekey: ignore the relay''s waiting limits (owner key RELAY_OWNER_ADMIN_KEY; refused without it)'
        type: boolean
        default: false
      forget_hosts:
        description: 'revoke: also forget and disconnect the hosts that key registered'
        type: boolean
        default: false
permissions: {}
# No Actions cache, neither restored nor saved (cache-mode, enforced by GitHub's cache service): a release, or a workflow
# holding more than the source read key, never takes files another run saved (scripts/check_public_ops.py).
cache-mode: none
concurrency:
  group: invite-tester
  cancel-in-progress: false
jobs:
  invite:
    # Only from the default branch; RELAY_ADMIN_KEY lives in the relay-admin environment,
    # restricted to that branch.
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: relay-admin
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ${{ vars.JAUNT_SOURCE_REPO }}
          ssh-key: ${{ secrets.SOURCE_READ_KEY }}
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - name: Install age
        run: sudo apt-get update -qq && sudo apt-get install -y -qq age
      - name: Create, list, rekey, revoke, status, connlog, account, reassign, exemptions or exempt
        env:
          JAUNT_RELAY_ADMIN_KEY: ${{ secrets.RELAY_ADMIN_KEY }}
          JAUNT_RELAY_URL: ${{ vars.JAUNT_RELAY_URL }}
          OWNER_PUBLIC_KEY: ${{ vars.OWNER_PUBLIC_KEY }}
          # rekey with force only: the owner's own admin secret, which the jaunt.one site does not hold.
          JAUNT_RELAY_OWNER_ADMIN_KEY: ${{ secrets.RELAY_OWNER_ADMIN_KEY }}
          # every action but revoke: where the script writes its age-encrypted answer, for the artifact below.
          JAUNT_STATUS_FILE: ${{ runner.temp }}/relay-status/relay-status.age
        run: python scripts/invite_tester.py github
      # The created invite, the list or the status, encrypted to OWNER_PUBLIC_KEY (never anything in clear), for `gh run download --name relay-status`.
      # Also after a failed run when the script wrote it (some actions answered, none with 200).
      - name: Keep the encrypted answer
        if: ${{ !cancelled() && inputs.action != 'revoke' && inputs.action != 'exempt' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: relay-status
          path: ${{ runner.temp }}/relay-status/relay-status.age
          if-no-files-found: ignore
          retention-days: 1
