name: Invite a tester
# Owner tool: create, list or revoke a tester invite on the relay, or read the relay's live admin
# state (status: quota.status, flags.get, certs.quota), a room's or an invite's connection log (connlog)
# or an invite's account budgets (account); both read-only. Job logs, summaries and artifacts are public,
# so the script prints no key and no tester name: create, list, status, connlog and account are encrypted with age to
# the repository variable OWNER_PUBLIC_KEY (an age or SSH public key) and refused without it; revoke
# prints the id only. each of those is also kept, encrypted, as the one-day artifact relay-status (gh run
# download). The inputs are read from the event file by the script, never interpolated into a command.
on:
  workflow_dispatch:
    inputs:
      action:
        description: 'create, list, revoke, status, connlog or account'
        type: choice
        options: [list, create, revoke, status, connlog, account]
        default: list
      name:
        description: "create: the tester's name (not printed; still run metadata, so a first name or a pseudonym)"
        required: false
        default: ''
      max_hosts:
        description: 'create: how many machines the key may register (1-100)'
        required: false
        default: '10'
      id:
        description: 'revoke, account, connlog: the invite id (inv-...); connlog takes this or room'
        required: false
        default: ''
      room:
        description: 'connlog: a room id (24 characters) instead of an invite id (not printed; still run metadata)'
        required: false
        default: ''
      from:
        description: 'connlog: first UTC day, YYYY-MM-DD (default: 3 days up to "to")'
        required: false
        default: ''
      to:
        description: 'connlog: last UTC day, YYYY-MM-DD (default: today; at most 31 days from "from")'
        required: false
        default: ''
      forget_hosts:
        description: 'revoke: also forget and disconnect the hosts that key registered'
        type: boolean
        default: false
permissions: {}
concurrency:
  group: invite-tester
  cancel-in-progress: false
jobs:
  invite:
    # Only from the default branch; RELAY_ADMIN_KEY lives in the relay-admin environment,
    # restricted to that branch.
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: relay-admin
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ${{ vars.JAUNT_SOURCE_REPO }}
          ssh-key: ${{ secrets.SOURCE_READ_KEY }}
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - name: Install age
        run: curl -fsSL -o "$RUNNER_TEMP/age.tgz" https://github.com/FiloSottile/age/releases/download/v1.2.1/age-v1.2.1-linux-amd64.tar.gz && echo "7df45a6cc87d4da11cc03a539a7470c15b1041ab2b396af088fe9990f7c79d50  $RUNNER_TEMP/age.tgz" | sha256sum -c - && tar -xzf "$RUNNER_TEMP/age.tgz" -C "$RUNNER_TEMP" && sudo install -m 0755 "$RUNNER_TEMP/age/age" /usr/local/bin/age
      - name: Create, list, revoke, status, connlog or account
        env:
          JAUNT_RELAY_ADMIN_KEY: ${{ secrets.RELAY_ADMIN_KEY }}
          JAUNT_RELAY_URL: ${{ vars.JAUNT_RELAY_URL }}
          OWNER_PUBLIC_KEY: ${{ vars.OWNER_PUBLIC_KEY }}
          # every action but revoke: where the script writes its age-encrypted answer, for the artifact below.
          JAUNT_STATUS_FILE: ${{ runner.temp }}/relay-status/relay-status.age
        run: python scripts/invite_tester.py github
      # The created invite, the list or the status, encrypted to OWNER_PUBLIC_KEY (never anything in clear), for `gh run download --name relay-status`.
      # Also after a failed run when the script wrote it (some actions answered, none with 200).
      - name: Keep the encrypted answer
        if: ${{ !cancelled() && inputs.action != 'revoke' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: relay-status
          path: ${{ runner.temp }}/relay-status/relay-status.age
          if-no-files-found: ignore
          retention-days: 1
