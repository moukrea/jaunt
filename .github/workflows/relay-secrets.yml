name: Relay secrets
# Owner tool: writes the relay Worker's access secrets from this repository's secrets, without a
# local wrangler login, then probes the relay. Job logs are public: values reach wrangler on stdin
# only, never a command line, and wrangler prints secret names only. Every existing registration is
# kept whatever is written: only new hosts are affected.
on:
  workflow_dispatch:
    inputs:
      keys:
        description: 'Write RELAY_KEYS (the probe key) and RELAY_ADMIN_KEY from the relay-production secrets'
        type: boolean
        default: false
      enforce:
        description: 'RELAY_KEY_REQUIRED: "on" refuses new hosts without a key, "off" opens registration again'
        type: choice
        options: ['unchanged', 'on', 'off']
        default: 'unchanged'
permissions: {}
concurrency:
  group: relay-secrets
  cancel-in-progress: false
jobs:
  secrets:
    # Only from the default branch; the keys live in the relay-production environment, restricted
    # to that branch.
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: relay-production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ${{ vars.JAUNT_SOURCE_REPO }}
          ssh-key: ${{ secrets.SOURCE_READ_KEY }}
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - run: npm ci
      - run: node --test tests/relay_secrets.test.mjs tests/relay_config.test.mjs
      - name: Write the Worker secrets (one new Worker version, or none)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROBE_KEY: ${{ secrets.JAUNT_RELAY_PROBE_KEY }}
          ADMIN_KEY: ${{ secrets.RELAY_ADMIN_KEY }}
          KEYS: ${{ inputs.keys }}
          ENFORCE: ${{ inputs.enforce }}
          WRANGLER_SEND_METRICS: 'false'
        run: |
          payload=$(node scripts/relay_secrets.mjs)
          if [ -z "$payload" ]; then echo "Nothing to write: the Worker is unchanged."; exit 0; fi
          printf '%s' "$payload" | npx --no-install wrangler secret bulk --config relay/wrangler.jsonc
      - name: The Worker's secret names
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: 'false'
        run: npx --no-install wrangler secret list --config relay/wrangler.jsonc
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - run: pip install 'aiohttp>=3.11,<4'
      - name: Probe the relay
        env:
          JAUNT_RELAY_URL: ${{ vars.JAUNT_RELAY_URL }}
          JAUNT_RELAY_KEY: ${{ secrets.JAUNT_RELAY_PROBE_KEY }}
          # What the relay must say now: the choice made here, else the repository's expectation.
          JAUNT_RELAY_EXPECT_REQUIRED: ${{ inputs.enforce == 'on' && '1' || inputs.enforce == 'off' && '0' || vars.JAUNT_RELAY_KEY_REQUIRED }}
        run: python scripts/release_pipeline.py relay-probe
