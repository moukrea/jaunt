name: CI
# Tests one commit of the private source (moukrea/jaunt-src), started by hand or by the release
# queue: gh workflow run ci.yml -f sha=<commit> -f kind=pr -f pr=<number>, or -f kind=main for a
# commit of source main. "CI main <commit>" runs are what the queue accepts before publishing that
# commit. Logs are public: pytest prints one line per failure.
run-name: CI ${{ inputs.kind }} ${{ inputs.sha }}
on:
  workflow_dispatch:
    inputs:
      sha:
        description: 'Source commit to test (40 lowercase hexadecimal characters)'
        required: true
        type: string
      kind:
        description: 'main: a commit of source main (the release queue waits for it); pr: a proposed change'
        type: choice
        options: [pr, main]
        default: pr
      pr:
        description: 'pr: the change number, so a newer run of the same change replaces an older one'
        required: false
        default: ''
permissions: {}
concurrency:
  group: ci-${{ inputs.kind }}-${{ inputs.pr || inputs.sha }}
  cancel-in-progress: ${{ inputs.kind == 'pr' }}
env:
  PYTEST_ADDOPTS: --tb=line
jobs:
  guard:
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Require an exact source commit
        env:
          SHA: ${{ inputs.sha }}
          KIND: ${{ inputs.kind }}
          PR: ${{ inputs.pr }}
        run: |
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "sha must be a full commit id (40 lowercase hexadecimal characters)"; exit 1; }
          [[ "$KIND" == main || "$KIND" == pr ]] || { echo "kind must be main or pr"; exit 1; }
          [[ -z "$PR" || "$PR" =~ ^[1-9][0-9]{0,6}$ ]] || { echo "pr must be a number"; exit 1; }
  # Which jobs a proposed change needs (scripts/ci_plan.py, docs/DEPLOYMENT.md "Selective CI"). A `CI main`
  # run, and a source without the script, run everything: the release queue accepts only full runs.
  plan:
    needs: guard
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      host_matrix: ${{ steps.plan.outputs.host_matrix }}
      groups: ${{ steps.plan.outputs.groups }}
      shells: ${{ steps.plan.outputs.shells }}
      direct_tls: ${{ steps.plan.outputs.direct_tls }}
      fedora: ${{ steps.plan.outputs.fedora }}
      windows: ${{ steps.plan.outputs.windows }}
      desktop_agent: ${{ steps.plan.outputs.desktop_agent }}
      network_bench: ${{ steps.plan.outputs.network_bench }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ${{ vars.JAUNT_SOURCE_REPO }}
          ssh-key: ${{ secrets.SOURCE_READ_KEY }}
          ref: ${{ inputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - id: plan
        env:
          KIND: ${{ inputs.kind }}
          SHA: ${{ inputs.sha }}
        run: |
          if [ "$KIND" = pr ] && [ -f scripts/ci_plan.py ]; then
            python3 scripts/ci_plan.py --base origin/main --head "$SHA" | tee -a "$GITHUB_OUTPUT"
          else
            {
              echo 'host_matrix=[{"os":"ubuntu-latest","python":"3.11"},{"os":"ubuntu-latest","python":"3.13"},{"os":"macos-latest","python":"3.11"},{"os":"macos-latest","python":"3.13"}]'
              echo 'groups=["terminal","rich","agents","lifecycle"]'
              echo shells=true direct_tls=true fedora=true windows=true desktop_agent=true network_bench=true | tr ' ' '\n'
            } | tee -a "$GITHUB_OUTPUT"
          fi
  lint:
    needs: guard
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ${{ vars.JAUNT_SOURCE_REPO }}
          ssh-key: ${{ secrets.SOURCE_READ_KEY }}
          ref: ${{ inputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - run: npm ci
      - run: npm run prepare-web
      - run: python scripts/check_project.py
  test:
    runs-on: ubuntu-latest
    needs: [plan, host, browser-and-relay, browser-shells, direct-tls, installer-fedora, windows, desktop-agent, network-bench]
    if: always()
    permissions: {}
    steps:
      - name: Require every planned test suite to succeed
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          GROUPS_PLANNED: ${{ needs.plan.outputs.groups != '[]' }}
          HOST_RESULT: ${{ needs.host.result }}
          BROWSER_RELAY_RESULT: ${{ needs.browser-and-relay.result }}
          FEDORA_RESULT: ${{ needs.installer-fedora.result }}
          FEDORA_PLANNED: ${{ needs.plan.outputs.fedora }}
          WINDOWS_RESULT: ${{ needs.windows.result }}
          WINDOWS_PLANNED: ${{ needs.plan.outputs.windows }}
          DESKTOP_AGENT_RESULT: ${{ needs.desktop-agent.result }}
          DESKTOP_AGENT_PLANNED: ${{ needs.plan.outputs.desktop_agent }}
          BROWSER_SHELLS_RESULT: ${{ needs.browser-shells.result }}
          BROWSER_SHELLS_PLANNED: ${{ needs.plan.outputs.shells }}
          DIRECT_TLS_RESULT: ${{ needs.direct-tls.result }}
          DIRECT_TLS_PLANNED: ${{ needs.plan.outputs.direct_tls }}
          NETWORK_BENCH_RESULT: ${{ needs.network-bench.result }}
          NETWORK_BENCH_PLANNED: ${{ needs.plan.outputs.network_bench }}
        run: |
          # A job the plan left out is skipped; one it asked for must have succeeded (a skipped one
          # whose predecessor failed is a failure here, not a pass).
          check() { if [ "$3" = true ]; then test "$2" = success; else test "$2" = skipped; fi; }
          test "$PLAN_RESULT" = success
          test "$HOST_RESULT" = success
          check browser-and-relay "$BROWSER_RELAY_RESULT" "$GROUPS_PLANNED"
          check installer-fedora "$FEDORA_RESULT" "$FEDORA_PLANNED"
          check windows "$WINDOWS_RESULT" "$WINDOWS_PLANNED"
          check desktop-agent "$DESKTOP_AGENT_RESULT" "$DESKTOP_AGENT_PLANNED"
          check browser-shells "$BROWSER_SHELLS_RESULT" "$BROWSER_SHELLS_PLANNED"
          check direct-tls "$DIRECT_TLS_RESULT" "$DIRECT_TLS_PLANNED"
          check network-bench "$NETWORK_BENCH_RESULT" "$NETWORK_BENCH_PLANNED"
  # A green "CI main <sha>" starts the release queue itself: GitHub starts no workflow_run for a CI
  # run that the queue dispatched with GITHUB_TOKEN, while a workflow_dispatch it may trigger. (A run
  # a person dispatched also triggers the workflow_run path; the queue's lock makes the second a no-op.)
  release:
    needs: [lint, test]
    if: inputs.kind == 'main' && success()
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Start the release queue
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run auto-release.yml --repo "$GITHUB_REPOSITORY" --ref main
  installer-fedora:
    needs: [guard, plan]
    if: needs.plan.outputs.fedora == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      matrix:
        fedora: ['43', '44']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ${{ vars.JAUNT_SOURCE_REPO }}
          ssh-key: ${{ secrets.SOURCE_READ_KEY }}
          ref: ${{ inputs.sha }}
          persist-credentials: false
      - name: Install the candidate release with the candidate installer on Fedora, from a copy of the site
        env:
          FEDORA_VERSION: ${{ matrix.fedora }}
        run: |
          # The site and the release served here (tests/release_site.py): nothing changes while the
          # test runs, and the installed release must be exactly the one announced.
          if [ -f tests/installer_fedora_e2e.py ]; then
            python3 tests/installer_fedora_e2e.py --fedora "$FEDORA_VERSION"
            exit 0
          fi
          # A source from before tests/installer_fedora_e2e.py (the release queue tests older merges
          # with this workflow): the public release from the live site, as it used to.
          docker run --rm -v "$PWD:/src:ro" \
            -e jaunt_NO_SERVICE=1 -e jaunt_SKIP_PAIR=1 -e jaunt_RELAY_URL=wss://relay.invalid \
            "fedora:$FEDORA_VERSION" bash -c '
              set -euo pipefail
              cat /etc/fedora-release
              # The release the site announces before the install: one may be published meanwhile
              # (scripts/installed_release.py accepts that one or this one, or the one a CDN edge
              # still caches, nothing else). Pages fetches retry for up to 2 min: a release redeploys it.
              curl -fsS --retry 10 --retry-delay 5 --retry-all-errors --retry-max-time 120 --connect-timeout 10 --max-time 30 -o /var/tmp/config-before.json https://moukrea.github.io/jaunt/config.json
              cat /src/install.sh | bash
              # A source from before scripts/installed_release.py (the release queue tests older merges with
              # this workflow) checks the release announced after the install, as it used to.
              if [ -f /src/scripts/installed_release.py ]; then
                /root/.local/share/jaunt/runtime/current/bin/python /src/scripts/installed_release.py --before /var/tmp/config-before.json
              else
                curl -fsS --retry 10 --retry-delay 5 --retry-all-errors --retry-max-time 120 --connect-timeout 10 --max-time 30 -o /var/tmp/config-after.json https://moukrea.github.io/jaunt/config.json
                expected=$(/root/.local/share/jaunt/runtime/current/bin/python -c "import json; print(json.load(open(\"/var/tmp/config-after.json\"))[\"release\"])")
                /root/.local/share/jaunt/runtime/current/bin/python -c "import json; from pathlib import Path; assert json.loads((Path.home()/\".local/share/jaunt/installation.json\").read_text())[\"tag\"] == \"$expected\""
              fi
              /root/.local/bin/jaunt --version
              /root/.local/bin/jaunt stop
            '
      - name: The public release from the live site (report only, never gating)
        if: matrix.fedora == '44'
        continue-on-error: true
        run: if [ -f tests/installer_live_smoke.py ]; then python3 tests/installer_live_smoke.py; else echo 'Checked above for this source.'; fi
      - name: Install with curl isolated from the installer temporary directory
        if: matrix.fedora == '44'
        run: python3 tests/installer_namespace_e2e.py
      - name: Install with full temporary storage and recover from curl write errors
        if: matrix.fedora == '44'
        run: python3 tests/installer_storage_e2e.py
  host:
    needs: [guard, plan]
    strategy:
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.host_matrix) }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ${{ vars.JAUNT_SOURCE_REPO }}
          ssh-key: ${{ secrets.SOURCE_READ_KEY }}
          ref: ${{ inputs.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - run: pip install -e . -r requirements-dev.txt
      - run: pytest -q
      - run: python scripts/build_release.py
  desktop-agent:
    # The native desktop agent (agent/desktop, docs/DESKTOP.md), which the host release ships: built
    # as released and tested on each platform it targets by the source's own agent/desktop/ci.sh (the
    # release's job agent runs the same script), so its build steps change with the source, not
    # here. A commit without that script passes at once. linux-x86_64's checks run in two parts on
    # two runners (JAUNT_DESKTOP_CI_PART, which a source from before it ignores: each part then runs
    # them all).
    needs: [guard, plan]
    if: needs.plan.outputs.desktop_agent == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux-x86_64
            part: screens
          - os: ubuntu-24.04
            platform: linux-x86_64
            part: web
          - os: ubuntu-24.04-arm
            platform: linux-aarch64
          - os: windows-latest
            platform: windows-x86_64
          - os: macos-latest
            platform: macos-universal
    runs-on: ${{ matrix.os }}
    # The longest platform (linux-x86_64, whole) took 16 to 35 min in October 2026. The source's ci.sh
    # bounds each command it runs, but older merges' ci.sh does not, so the step has its own limit.
    # The upload then still runs, so a timed-out step leaves its logs (dist/desktop-agent/*.log).
    timeout-minutes: 50
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ${{ vars.JAUNT_SOURCE_REPO }}
          ssh-key: ${{ secrets.SOURCE_READ_KEY }}
          ref: ${{ inputs.sha }}
          persist-credentials: false
      - id: crate
        shell: bash
        run: if [ -f agent/desktop/ci.sh ]; then echo present=true >> "$GITHUB_OUTPUT"; else echo present=false >> "$GITHUB_OUTPUT"; echo "No desktop agent in this commit"; fi
      - if: steps.crate.outputs.present == 'true'
        shell: bash
        timeout-minutes: 40
        env:
          PLATFORM: ${{ matrix.platform }}
          JAUNT_DESKTOP_CI_PART: ${{ matrix.part }}
        run: bash agent/desktop/ci.sh "$PLATFORM"
      - if: always() && steps.crate.outputs.present == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: desktop-agent-${{ matrix.platform }}${{ matrix.part && format('-{0}', matrix.part) || '' }}
          path: dist/desktop-agent/
          if-no-files-found: ${{ job.status == 'success' && 'error' || 'warn' }}
          retention-days: 1
  windows:
    needs: [guard, plan]
    if: needs.plan.outputs.windows == 'true'
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ${{ vars.JAUNT_SOURCE_REPO }}
          ssh-key: ${{ secrets.SOURCE_READ_KEY }}
          ref: ${{ inputs.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - run: pip install -e . -r requirements-dev.txt
      - run: pytest -q -rA tests/test_windows.py tests/test_screen.py tests/test_termstate.py tests/test_direct.py
      - run: python tests/windows_install_e2e.py
  # The shell-list suites (tabs, names, background, limits, launch, sidebar): a job of their own, so
  # browser-and-relay stays inside its timeout. Each runs only where the source has it.
  browser-shells:
    needs: [guard, plan]
    if: needs.plan.outputs.shells == 'true'
    timeout-minutes: 25
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ${{ vars.JAUNT_SOURCE_REPO }}
          ssh-key: ${{ secrets.SOURCE_READ_KEY }}
          ref: ${{ inputs.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - run: pip install -e . -r requirements-dev.txt
      - run: npm ci
      - run: npm run prepare-web
      # apt waited two to three minutes on each stalled download from Ubuntu's mirror before asking again:
      # one Playwright install in eight took 5 to 16 minutes that way (October 2026); the retries came in seconds.
      - run: printf 'Acquire::http::Timeout "30";\nAcquire::https::Timeout "30";\nAcquire::Retries "5";\n' | sudo tee /etc/apt/apt.conf.d/99-jaunt-ci
      - run: python -m playwright install --with-deps chromium
      - run: if [ -f tests/limits_e2e.py ]; then python tests/limits_e2e.py; else echo 'Not in this source'; fi
      - run: if [ -f tests/launch_e2e.py ]; then python tests/launch_e2e.py; else echo 'Not in this source'; fi
      - run: if [ -f tests/tab_names_e2e.py ]; then python tests/tab_names_e2e.py; else echo 'Not in this source'; fi
      - run: if [ -f tests/session_rename_e2e.py ]; then python tests/session_rename_e2e.py; else echo 'Not in this source'; fi
      - run: if [ -f tests/background_e2e.py ]; then python tests/background_e2e.py; else echo 'Not in this source'; fi
      - run: if [ -f tests/sidebar_tabs_e2e.py ]; then python tests/sidebar_tabs_e2e.py; else echo 'Not in this source'; fi
      - run: if [ -f tests/sidebar_search_e2e.py ]; then python tests/sidebar_search_e2e.py; else echo 'Not in this source'; fi
      - run: if [ -f tests/history_ui_e2e.py ]; then python tests/history_ui_e2e.py; else echo 'Not in this source'; fi
      # The web channel (docs/PROTOCOL.md "Web channel"): the Web panel and streams over the direct link.
      - run: if [ -f tests/web_e2e.py ]; then python tests/web_e2e.py; else echo 'Not in this source'; fi
      - run: if [ -f tests/web_android_e2e.py ]; then python tests/web_android_e2e.py; else echo 'Not in this source'; fi
      - run: if [ -f tests/web_guest_e2e.py ]; then python tests/web_guest_e2e.py; else echo 'Not in this source'; fi
      # Public links: the relay Worker itself (workerd) serves the visitor's page; a visitor's Chromium gets the site over WebRTC.
      - run: if [ -f tests/web_public_e2e.py ]; then python tests/web_public_e2e.py; else echo 'Not in this source'; fi
  direct-tls:
    # Stage 3 of the direct connection cascade (docs/PROTOCOL.md "Direct link over TLS"): the relay's
    # certificate flow against Pebble (Let's Encrypt's test CA, pinned) with a fake Cloudflare DNS API,
    # then headless Chromium reaching a real host through its TURN server over TLS only. No real
    # certificate and no real DNS record is ever made. The TURN server's and the host's unit tests run in `host`.
    needs: [guard, plan]
    if: needs.plan.outputs.direct_tls == 'true'
    timeout-minutes: 20
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ${{ vars.JAUNT_SOURCE_REPO }}
          ssh-key: ${{ secrets.SOURCE_READ_KEY }}
          ref: ${{ inputs.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Pebble and its DNS test server, pinned releases checked by SHA-256
        run: |
          set -e
          dir="$RUNNER_TEMP/pebble"; mkdir -p "$dir"; cd "$dir"
          base=https://github.com/letsencrypt/pebble/releases/download/v2.10.1
          curl -sSLf -o pebble.tar.gz "$base/pebble-linux-amd64.tar.gz"
          curl -sSLf -o challtestsrv.tar.gz "$base/pebble-challtestsrv-linux-amd64.tar.gz"
          echo "4f2fcb5bca8c85c9cf73ad140fccfc0d2be40bd81ab99879c79b7b8a0b4f70ed  pebble.tar.gz" | sha256sum -c -
          echo "e93a5aa25ecdf3af2f9fbb2de32b0173e64a2eae81002a4ccfe35fa6f4f60b92  challtestsrv.tar.gz" | sha256sum -c -
          tar xzf pebble.tar.gz
          tar xzf challtestsrv.tar.gz
          # The release archives store both binaries without the executable bit.
          chmod +x pebble-linux-amd64/linux/amd64/pebble pebble-challtestsrv-linux-amd64/linux/amd64/pebble-challtestsrv
          echo "PEBBLE_BIN=$dir/pebble-linux-amd64/linux/amd64/pebble" >> "$GITHUB_ENV"
          echo "PEBBLE_CHALLTESTSRV_BIN=$dir/pebble-challtestsrv-linux-amd64/linux/amd64/pebble-challtestsrv" >> "$GITHUB_ENV"
      - run: npm ci
      - run: npm run prepare-web
      - run: if [ -f tests/relay_acme.miniflare.mjs ]; then npm run test:relay-acme; else echo 'Not in this source'; fi
      - run: pip install -e . -r requirements-dev.txt
      # apt waited two to three minutes on each stalled download from Ubuntu's mirror before asking again:
      # one Playwright install in eight took 5 to 16 minutes that way (October 2026); the retries came in seconds.
      - run: printf 'Acquire::http::Timeout "30";\nAcquire::https::Timeout "30";\nAcquire::Retries "5";\n' | sudo tee /etc/apt/apt.conf.d/99-jaunt-ci
      - run: sudo apt-get install -y libnss3-tools
      - run: python -m playwright install --with-deps chromium
      - run: if [ -f tests/direct_tls_e2e.py ]; then python tests/direct_tls_e2e.py; else echo 'Not in this source'; fi
  # The network bench (tests/net_bench.py): simulated networks in network namespaces (NATs, a network
  # that lets out only TCP 443, a router running miniupnpd), a real host, the test relay and Chromium;
  # which stage the direct link takes on each. Runs only where the source has it.
  network-bench:
    needs: [guard, plan]
    if: needs.plan.outputs.network_bench == 'true'
    timeout-minutes: 30
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ${{ vars.JAUNT_SOURCE_REPO }}
          ssh-key: ${{ secrets.SOURCE_READ_KEY }}
          ref: ${{ inputs.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - run: pip install -e . -r requirements-dev.txt
      - run: npm ci
      - run: npm run prepare-web
      # apt waited two to three minutes on each stalled download from Ubuntu's mirror before asking again:
      # one Playwright install in eight took 5 to 16 minutes that way (October 2026); the retries came in seconds.
      - run: printf 'Acquire::http::Timeout "30";\nAcquire::https::Timeout "30";\nAcquire::Retries "5";\n' | sudo tee /etc/apt/apt.conf.d/99-jaunt-ci
      - run: python -m playwright install --with-deps chromium
      # nft, miniupnpd for the bench's router and coturn for its TURN server (stage 4) only: never started
      # as services on the runner's own network (policy-rc.d refuses every service start during the install).
      - name: Network tools for the bench
        run: |
          printf '#!/bin/sh\nexit 101\n' | sudo tee /usr/sbin/policy-rc.d >/dev/null
          sudo chmod 755 /usr/sbin/policy-rc.d
          sudo apt-get update -q
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -q --no-install-recommends nftables miniupnpd-nftables libnss3-tools coturn
          sudo rm -f /usr/sbin/policy-rc.d
          if systemctl is-active --quiet miniupnpd; then sudo systemctl stop miniupnpd; fi
          if systemctl is-active --quiet coturn; then sudo systemctl stop coturn; fi
      # Ubuntu 24.04 restricts unprivileged user namespaces through AppArmor; the bench needs one
      # (it runs unprivileged inside it, as on a workstation).
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: if [ -f tests/net_bench.py ]; then python tests/net_bench.py; else echo 'Not in this source'; fi
        env:
          JAUNT_NETBENCH_REQUIRED: '1'
          JAUNT_NETBENCH_COTURN: required
      # Electron downloads its binary on first start; the bench starts the app inside a network namespace that has no
      # route to the internet, so fetch it here first.
      - run: node node_modules/electron/install.js
      # A phone on a mobile network: fetches of every kind (gzip with a Content-Length, Range, 16 MB files) over a link that is
      # cut for 12 s (a cell handover) all succeed. It shapes the link with tc in a user and network namespace, like the bench above.
      - run: if [ -f tests/web_bench.py ]; then JAUNT_BENCH_STRESS=2 xvfb-run -a python tests/web_bench.py; else echo 'Not in this source'; fi
        timeout-minutes: 10
        env:
          JAUNT_BENCH_REQUIRED: '1'
  browser-and-relay:
    # The real browser, desktop and installer suites, in four groups on four runners at once: in one
    # job they took 32 to 42 minutes (main runs of 2026-10-21 to 26), the critical path of the whole
    # run. Each group took about 8 minutes of suites then (medians of those runs): terminal (the
    # terminal, workspaces, the relay's own tests), rich (the rich view), agents (agents, artifacts,
    # scale, Android), lifecycle (direct links, the host's lifecycle, the installer and its release). A
    # suite added here goes to the group it belongs with; check the groups' times now and then.
    needs: [guard, plan]
    if: needs.plan.outputs.groups != '[]'
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        group: ${{ fromJSON(needs.plan.outputs.groups) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ${{ vars.JAUNT_SOURCE_REPO }}
          ssh-key: ${{ secrets.SOURCE_READ_KEY }}
          ref: ${{ inputs.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - run: pip install -e . -r requirements-dev.txt
      - run: npm ci
      - run: npm run prepare-web
      - run: npm test
        if: matrix.group == 'terminal'
      - run: npm run test:relay
        if: matrix.group == 'terminal'
      # scripts/invite_tester.py against the local Worker (skipped by the host job, which has no npm packages).
      - run: python -m pytest -q tests/test_invite_tester.py
        if: matrix.group == 'terminal'
      # apt waited two to three minutes on each stalled download from Ubuntu's mirror before asking again:
      # one Playwright install in eight took 5 to 16 minutes that way (October 2026); the retries came in seconds.
      - run: printf 'Acquire::http::Timeout "30";\nAcquire::https::Timeout "30";\nAcquire::Retries "5";\n' | sudo tee /etc/apt/apt.conf.d/99-jaunt-ci
      - run: python -m playwright install --with-deps chromium
      - run: python tests/browser_e2e.py
        if: matrix.group == 'terminal'
      - run: xvfb-run -a python tests/shared_workspace_e2e.py
        if: matrix.group == 'terminal'
      - run: xvfb-run -a python tests/desktop_download_e2e.py
        if: matrix.group == 'terminal'
      - run: xvfb-run -a python tests/desktop_artifacts_e2e.py
        if: matrix.group == 'terminal'
      - run: python tests/feedback_e2e.py
        if: matrix.group == 'terminal'
      - run: if [ -f tests/feedback_ui_e2e.py ]; then python tests/feedback_ui_e2e.py; else echo 'Not in this source'; fi
        if: matrix.group == 'terminal'
      - run: python tests/terminal_render_e2e.py
        if: matrix.group == 'terminal'
      - run: if [ -f tests/terminal_keybar_e2e.py ]; then python tests/terminal_keybar_e2e.py; else echo 'Not in this source'; fi
        if: matrix.group == 'terminal'
      - run: python tests/workspace_usability_e2e.py
        if: matrix.group == 'terminal'
      - run: python tests/workspace_sync_e2e.py
        if: matrix.group == 'terminal'
      - run: python tests/latency_e2e.py
        if: matrix.group == 'terminal'
      - run: python tests/flow_control_e2e.py
        if: matrix.group == 'terminal'
      - run: python tests/direct_e2e.py
        if: matrix.group == 'lifecycle'
      # A host's web server in another computer's browser through the desktop app (docs/PROTOCOL.md "Web over HTTPS").
      - run: if [ -f tests/web_desktop_e2e.py ]; then xvfb-run -a python tests/web_desktop_e2e.py; else echo 'Not in this source'; fi
        if: matrix.group == 'lifecycle'
      # Throughput of the same path (a large file, many files, many small requests) with floors well under what it gives.
      - run: if [ -f tests/web_bench.py ]; then xvfb-run -a python tests/web_bench.py; else echo 'Not in this source'; fi
        if: matrix.group == 'lifecycle'
        timeout-minutes: 10   # the bench bounds its own waits (480 s); a step that stops must not hold the job to its limit
      - run: python tests/scrollback_e2e.py
        if: matrix.group == 'terminal'
      - run: python tests/mobile_scroll_e2e.py
        if: matrix.group == 'lifecycle'
      - run: python tests/history_geometry_e2e.py
        if: matrix.group == 'terminal'
      - run: python tests/restart_e2e.py
        if: matrix.group == 'lifecycle'
      - run: python tests/host_crash_e2e.py
        if: matrix.group == 'lifecycle'
      - run: python tests/host_systemd_e2e.py
        if: matrix.group == 'lifecycle'
      - run: python tests/tab_switch_e2e.py
        if: matrix.group == 'terminal'
      - run: python tests/remote_paste_e2e.py
        if: matrix.group == 'terminal'
      - run: python tests/artifacts_e2e.py
        if: matrix.group == 'agents'
      - run: python tests/artifact_runtime_e2e.py
        if: matrix.group == 'agents'
      - run: if [ -f tests/artifact_terminal_e2e.py ]; then python tests/artifact_terminal_e2e.py; else echo 'Not in this source'; fi
        if: matrix.group == 'agents'
      - run: python tests/rich_view_e2e.py
        if: matrix.group == 'rich'
      - run: python tests/rich_control_e2e.py
        if: matrix.group == 'rich'
      - run: python tests/rich_codex_e2e.py
        if: matrix.group == 'rich'
      - run: python tests/rich_parity_e2e.py
        if: matrix.group == 'rich'
      # The rich view's status line. Newer than some merges of the release queue, and from before the
      # stand-in claude took its signal handlers first (tests/rich_view_e2e.py): older sources run it
      # as a race, so it runs only where the source has that.
      - run: if [ -f tests/richline_e2e.py ] && grep -q 'the handlers come first' tests/rich_view_e2e.py; then python tests/richline_e2e.py; else echo 'Not in this source'; fi
        if: matrix.group == 'rich'
      # The agents of a Claude Code session in the rich view: newer than some merges of the release queue.
      - run: if [ -f tests/rich_agents_e2e.py ]; then python tests/rich_agents_e2e.py; else echo 'Not in this source'; fi
        if: matrix.group == 'rich'
      - run: if [ -f tests/rich_workflows_e2e.py ]; then python tests/rich_workflows_e2e.py; else echo 'Not in this source'; fi
        if: matrix.group == 'rich'
      # The Claude Code mod and the agents' actions, tasks and notifications. The first two run a stand-in claude; the others drive a real
      # throwaway Claude Code and skip at once (exit 0) on a runner without it or its credentials.
      - run: if [ -f tests/rich_agent_actions_ui_e2e.py ]; then python tests/rich_agent_actions_ui_e2e.py; else echo 'Not in this source'; fi
        if: matrix.group == 'rich'
      - run: if [ -f tests/rich_agents_tasks_e2e.py ]; then python tests/rich_agents_tasks_e2e.py; else echo 'Not in this source'; fi
        if: matrix.group == 'rich'
      # A message sent through the mod is the person's own and confirms its bubble (stand-in claude playing the mod).
      - run: if [ -f tests/rich_mod_send_e2e.py ]; then python tests/rich_mod_send_e2e.py; else echo 'Not in this source'; fi
        if: matrix.group == 'rich'
      - run: if [ -f tests/rich_mod_e2e.py ]; then python tests/rich_mod_e2e.py; else echo 'Not in this source'; fi
        if: matrix.group == 'rich'
      - run: if [ -f tests/rich_reload_e2e.py ]; then python tests/rich_reload_e2e.py; else echo 'Not in this source'; fi
        if: matrix.group == 'rich'
      # Long messages to a real Claude Code (skips without claude and its credentials).
      - run: if [ -f tests/rich_long_message_e2e.py ]; then python tests/rich_long_message_e2e.py; else echo 'Not in this source'; fi
        if: matrix.group == 'rich'
      - run: if [ -f tests/rich_agent_actions_e2e.py ]; then python tests/rich_agent_actions_e2e.py; else echo 'Not in this source'; fi
        if: matrix.group == 'rich'
      - run: if [ -f tests/rich_workflow_actions_e2e.py ]; then python tests/rich_workflow_actions_e2e.py; else echo 'Not in this source'; fi
        if: matrix.group == 'rich'
      - run: if [ -f tests/mod_register.test.mjs ]; then node --test tests/mod_register.test.mjs; else echo 'Not in this source'; fi
        if: matrix.group == 'rich'
      - run: if [ -f tests/rich_notify_e2e.py ]; then python tests/rich_notify_e2e.py; else echo 'Not in this source'; fi
        if: matrix.group == 'rich'
      # An AI session opening a shell of the owner's (jaunt open): the question on the paired browser, the tab, the journal.
      - run: if [ -f tests/agent_open_e2e.py ]; then python tests/agent_open_e2e.py; else echo 'Not in this source'; fi
        if: matrix.group == 'rich'
      # A long message folded with "Show more" (the page's own view against a fake host), and a conversation that ended resumed from the banner.
      - run: if [ -f tests/rich_view_fold_e2e.py ]; then python tests/rich_view_fold_e2e.py; else echo 'Not in this source'; fi
        if: matrix.group == 'rich'
      - run: if [ -f tests/rich_resume_e2e.py ]; then python tests/rich_resume_e2e.py; else echo 'Not in this source'; fi
        if: matrix.group == 'rich'
      - run: if [ -f tests/rich_workflow_actions_ui_e2e.py ]; then python tests/rich_workflow_actions_ui_e2e.py; else echo 'Not in this source'; fi
        if: matrix.group == 'rich'
      # Recalling a message in the message box. Sources before its wait after a reload (marked by the words grepped for here) have a race: they skip it.
      - run: if [ -f tests/rich_history_e2e.py ] && grep -q 'comes from the host after it' tests/rich_history_e2e.py; then python tests/rich_history_e2e.py; else echo 'Not in this source'; fi
        if: matrix.group == 'rich'
      - run: if [ -f tests/rich_phone_start_e2e.py ]; then python tests/rich_phone_start_e2e.py; else echo 'Not in this source'; fi
        if: matrix.group == 'rich'
      # Daily-driving Claude Code from the rich view against a real, throwaway one (skips without claude and its credentials, as rich_mod_e2e does).
      - run: if [ -f tests/rich_daily_e2e.py ]; then python tests/rich_daily_e2e.py; else echo 'Not in this source'; fi
        if: matrix.group == 'rich'
      # Claude Code's sign-in as a card: the card in a browser on the real screens of 2.1.299, and /login against a real Claude Code with no credentials (skips without claude).
      - run: if [ -f tests/richlogin_ui_e2e.py ]; then python tests/richlogin_ui_e2e.py; else echo 'Not in this source'; fi
        if: matrix.group == 'rich'
      - run: if [ -f tests/rich_login_e2e.py ]; then python tests/rich_login_e2e.py; else echo 'Not in this source'; fi
        if: matrix.group == 'rich'
      # A Claude Code that says it waits for an answer and drew nothing: the terminal card that says so, in a browser (no terminal).
      - run: if [ -f tests/rich_blank_ui_e2e.py ]; then python tests/rich_blank_ui_e2e.py; else echo 'Not in this source'; fi
        if: matrix.group == 'rich'
      # The view's own logic against a fake host (Stop before the message was recorded, Claude Code's own queue, an answered question).
      - run: if [ -f tests/rich_view_logic_e2e.py ]; then python tests/rich_view_logic_e2e.py; else echo 'Not in this source'; fi
        if: matrix.group == 'rich'
      - run: python tests/webgl_render_e2e.py
        if: matrix.group == 'agents'
      - run: python tests/android_download_e2e.py
        if: matrix.group == 'agents'
      - run: python tests/agents_e2e.py
        if: matrix.group == 'agents'
      - run: python tests/agents_ui_e2e.py
        if: matrix.group == 'agents'
      - run: python tests/agentshome_e2e.py
        if: matrix.group == 'agents'
      # A suite newer than some merges still in the release queue (which runs main CI on them with
      # this workflow) runs only where the source has it.
      - run: if [ -f tests/agentshome_ui_e2e.py ]; then python tests/agentshome_ui_e2e.py; else echo 'Not in this source'; fi
        if: matrix.group == 'agents'
      # A program enrolled with its own manifest, through the web client (Settings → Programs, revoke).
      - run: if [ -f tests/service_manifest_ui_e2e.py ]; then python tests/service_manifest_ui_e2e.py; else echo 'Not in this source'; fi
        if: matrix.group == 'agents'
      # A service's questions on the desktop app of the host's own computer (Electron, its local connection).
      - run: if [ -f tests/agentsworld_desktop_e2e.py ]; then xvfb-run -a python tests/agentsworld_desktop_e2e.py; else echo 'Not in this source'; fi
        if: matrix.group == 'agents'
      - run: python tests/bridge_ui_e2e.py
        if: matrix.group == 'agents'
      - run: python tests/i18n_e2e.py
        if: matrix.group == 'agents'
      # The interface's scale at every step, desktop and phone; the desktop app's window zoom (its own Xvfb).
      - run: if [ -f tests/ui_scale_e2e.py ]; then python tests/ui_scale_e2e.py; else echo 'Not in this source'; fi
        if: matrix.group == 'agents'
      - run: if [ -f tests/desktop_scale_e2e.py ]; then python tests/desktop_scale_e2e.py; else echo 'Not in this source'; fi
        if: matrix.group == 'agents'
      - run: xvfb-run -a python tests/pwa_e2e.py
        if: matrix.group == 'agents'
      - run: python tests/handoff_e2e.py
        if: matrix.group == 'agents'
      - run: python tests/browser_e2e.py
        if: matrix.group == 'lifecycle'
        env:
          jaunt_E2E_RELAY: workerd
      - run: python scripts/build_release.py
        if: matrix.group == 'lifecycle'
      - run: python tests/installer_e2e.py
        if: matrix.group == 'lifecycle'
      - run: python tests/client_update_e2e.py
        if: matrix.group == 'lifecycle'
      # The legacy host fixture is a release of this repository (mirrored from the source's own).
      - name: Download the public legacy host fixture
        if: matrix.group == 'lifecycle'
        env:
          GH_TOKEN: ${{ github.token }}
          JAUNT_RELEASE_REPOSITORY: ${{ github.repository }}
        run: python scripts/release_pipeline.py download --tag v0.1.0-beta.10 --pattern '*.whl' --pattern 'host-manifest.json' --pattern 'SHA256SUMS' --directory "$RUNNER_TEMP/legacy-host"
      - name: Verify legacy restart protection and explicit migration
        if: matrix.group == 'lifecycle'
        env:
          jaunt_LEGACY_RELEASE_DIR: ${{ runner.temp }}/legacy-host
        run: python tests/installer_e2e.py
