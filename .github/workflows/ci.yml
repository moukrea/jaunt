  desktop-agent:
    # The native desktop agent (agent/desktop, docs/DESKTOP.md), which the host release ships: built
    # as released and tested on each platform it targets by the source's own agent/desktop/ci.sh (the
    # release's job agent runs the same script), so its build steps change with the source, not
    # here. A commit without that script passes at once. linux-x86_64's checks run in two parts on
    # two runners (JAUNT_DESKTOP_CI_PART, which a source from before it ignores: each part then runs
    # them all).
    needs: [guard, plan]
    if: needs.plan.outputs.desktop_agent == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux-x86_64
            part: screens
          - os: ubuntu-24.04
            platform: linux-x86_64
            part: web
          - os: ubuntu-24.04-arm
            platform: linux-aarch64
          - os: windows-latest
            platform: windows-x86_64
          - os: macos-latest
            platform: macos-universal
    runs-on: ${{ matrix.os }}
    # The longest platform (linux-x86_64, whole) took 16 to 35 min in October 2026. The source's ci.sh
    # bounds each command it runs, but older merges' ci.sh does not, so the step has its own limit.
    # The upload then still runs, so a timed-out step leaves its logs (dist/desktop-agent/*.log).
    timeout-minutes: 50
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ${{ vars.JAUNT_SOURCE_REPO }}
          ssh-key: ${{ secrets.SOURCE_READ_KEY }}
          ref: ${{ inputs.sha }}
          persist-credentials: false
      - id: crate
        shell: bash
        run: if [ -f agent/desktop/ci.sh ]; then echo present=true >> "$GITHUB_OUTPUT"; else echo present=false >> "$GITHUB_OUTPUT"; echo "No desktop agent in this commit"; fi
      - if: steps.crate.outputs.present == 'true'
        shell: bash
        timeout-minutes: 40
        env:
          PLATFORM: ${{ matrix.platform }}
          JAUNT_DESKTOP_CI_PART: ${{ matrix.part }}
        run: bash agent/desktop/ci.sh "$PLATFORM"
      - if: always() && steps.crate.outputs.present == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: desktop-agent-${{ matrix.platform }}${{ matrix.part && format('-{0}', matrix.part) || '' }}
          path: dist/desktop-agent/
          if-no-files-found: ${{ job.status == 'success' && 'error' || 'warn' }}
          retention-days: 1
  windows:
