name: CI
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: npm ci
      - run: npm run prepare-web
      - run: python scripts/check_project.py
  test:
    runs-on: ubuntu-latest
    needs: [host, browser-and-relay, installer-fedora]
    if: always()
    steps:
      - name: Require every real test suite to succeed
        env:
          HOST_RESULT: ${{ needs.host.result }}
          BROWSER_RELAY_RESULT: ${{ needs.browser-and-relay.result }}
          FEDORA_RESULT: ${{ needs.installer-fedora.result }}
        run: |
          test "$HOST_RESULT" = success
          test "$BROWSER_RELAY_RESULT" = success
          test "$FEDORA_RESULT" = success
  installer-fedora:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        fedora: ['43', '44']
    steps:
      - uses: actions/checkout@v4
      - name: Install the public wheel with the candidate installer on Fedora
        env:
          FEDORA_VERSION: ${{ matrix.fedora }}
        run: |
          docker run --rm -v "$PWD:/src:ro" \
            -e jaunt_NO_SERVICE=1 -e jaunt_SKIP_PAIR=1 \
            "fedora:$FEDORA_VERSION" bash -c '
              set -euo pipefail
              cat /etc/fedora-release
              cat /src/install.sh | bash
              expected=$(/root/.local/share/jaunt/runtime/current/bin/python -c "import json,urllib.request; print(json.load(urllib.request.urlopen(\"https://moukrea.github.io/jaunt/config.json\", timeout=30))[\"release\"])")
              /root/.local/share/jaunt/runtime/current/bin/python -c "import json; from pathlib import Path; assert json.loads((Path.home()/\".local/share/jaunt/installation.json\").read_text())[\"tag\"] == \"$expected\""
              /root/.local/bin/jaunt --version
              /root/.local/bin/jaunt stop
            '
      - name: Install with curl isolated from the installer temporary directory
        if: matrix.fedora == '44'
        run: python3 tests/installer_namespace_e2e.py
      - name: Install with full temporary storage and recover from curl write errors
        if: matrix.fedora == '44'
        run: python3 tests/installer_storage_e2e.py
  host:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -e . -r requirements-dev.txt
      - run: pytest -q
      - run: python scripts/build_release.py
  browser-and-relay:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -e . -r requirements-dev.txt
      - run: npm ci
      - run: npm run prepare-web
      - run: python scripts/check_project.py
      - run: npm test
      - run: npm run test:relay
      - run: python -m playwright install --with-deps chromium
      - run: python tests/browser_e2e.py
      - run: xvfb-run -a python tests/shared_workspace_e2e.py
      - run: python tests/terminal_render_e2e.py
      - run: python tests/browser_e2e.py
        env:
          jaunt_E2E_RELAY: workerd
      - run: python scripts/build_release.py
      - run: python tests/installer_e2e.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence
          path: test-results/
          if-no-files-found: ignore
