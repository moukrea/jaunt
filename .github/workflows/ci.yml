name: CI
# Tests one commit of the private source (moukrea/jaunt-src), started by hand or by the release
# queue: gh workflow run ci.yml -f sha=<commit> -f kind=pr -f pr=<number>, or -f kind=main for a
# commit of source main. "CI main <commit>" runs are what the queue accepts before publishing that
# commit. Logs are public: pytest prints one line per failure.
run-name: CI ${{ inputs.kind }} ${{ inputs.sha }}
on:
  workflow_dispatch:
    inputs:
      sha:
        description: 'Source commit to test (40 lowercase hexadecimal characters)'
        required: true
        type: string
      kind:
        description: 'main: a commit of source main (the release queue waits for it); pr: a proposed change'
        type: choice
        options: [pr, main]
        default: pr
      pr:
        description: 'pr: the change number, so a newer run of the same change replaces an older one'
        required: false
        default: ''
permissions: {}
concurrency:
  group: ci-${{ inputs.kind }}-${{ inputs.pr || inputs.sha }}
  cancel-in-progress: ${{ inputs.kind == 'pr' }}
env:
  PYTEST_ADDOPTS: --tb=line
jobs:
  guard:
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Require an exact source commit
        env:
          SHA: ${{ inputs.sha }}
          KIND: ${{ inputs.kind }}
          PR: ${{ inputs.pr }}
        run: |
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "sha must be a full commit id (40 lowercase hexadecimal characters)"; exit 1; }
          [[ "$KIND" == main || "$KIND" == pr ]] || { echo "kind must be main or pr"; exit 1; }
          [[ -z "$PR" || "$PR" =~ ^[1-9][0-9]{0,6}$ ]] || { echo "pr must be a number"; exit 1; }
  # Which jobs a proposed change needs (scripts/ci_plan.py, docs/DEPLOYMENT.md "Selective CI"). A `CI main`
  # run, and a source without the script, run everything: the release queue accepts only full runs.
  plan:
    needs: guard
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      host_matrix: ${{ steps.reuse.outputs.host_matrix || steps.plan.outputs.host_matrix }}
      groups: ${{ steps.reuse.outputs.groups || steps.plan.outputs.groups }}
      shells: ${{ steps.reuse.outputs.shells || steps.plan.outputs.shells }}
      direct_tls: ${{ steps.reuse.outputs.direct_tls || steps.plan.outputs.direct_tls }}
      fedora: ${{ steps.reuse.outputs.fedora || steps.plan.outputs.fedora }}
      windows: ${{ steps.reuse.outputs.windows || steps.plan.outputs.windows }}
      desktop_agent: ${{ steps.reuse.outputs.desktop_agent || steps.plan.outputs.desktop_agent }}
      network_bench: ${{ steps.reuse.outputs.network_bench || steps.plan.outputs.network_bench }}
      android: ${{ steps.reuse.outputs.android || steps.plan.outputs.android }}
      client_link: ${{ steps.reuse.outputs.client_link || steps.plan.outputs.client_link }}
      flake_tests: ${{ steps.plan.outputs.flake_tests }}
      flake_suites: ${{ steps.plan.outputs.flake_suites }}
      flake_e2e: ${{ steps.plan.outputs.flake_e2e }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ${{ vars.JAUNT_SOURCE_REPO }}
          ssh-key: ${{ secrets.SOURCE_READ_KEY }}
          ref: ${{ inputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - id: plan
        env:
          KIND: ${{ inputs.kind }}
          SHA: ${{ inputs.sha }}
        run: |
          if [ "$KIND" = pr ] && [ -f scripts/ci_plan.py ]; then
            python3 scripts/ci_plan.py --base origin/main --head "$SHA" | tee -a "$GITHUB_OUTPUT"
          else
            {
              echo 'host_matrix=[{"os":"ubuntu-latest","python":"3.11"},{"os":"ubuntu-latest","python":"3.13"},{"os":"macos-latest","python":"3.11"},{"os":"macos-latest","python":"3.13"}]'
              echo 'groups=["terminal","rich","agents","lifecycle"]'
              echo shells=true direct_tls=true fedora=true windows=true desktop_agent=true network_bench=true android=true client_link=true | tr ' ' '\n'
              echo 'flake_tests='
              echo 'flake_suites=[]'
              echo 'flake_e2e={}'
            } | tee -a "$GITHUB_OUTPUT"
          fi
      # A `CI main` run does not repeat what a `CI pr` run of this repository already proved on the same files.
      # Reused only: a job (or matrix leg) that succeeded in a workflow_dispatch run of this repository named
      # `CI pr <commit>`, from this workflow file exactly as it is now (the same blob), for a commit whose tree is
      # the tree under test. The release queue still sees a run whose `lint` and `test` succeeded; the jobs reused
      # show as skipped, and the summary names the run each came from. Lint always runs.
      - id: reuse
        if: inputs.kind == 'main'
        continue-on-error: true   # without it every job runs, as before
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ inputs.sha }}
          WORKFLOW_SHA: ${{ github.sha }}
          MATRIX: ${{ steps.plan.outputs.host_matrix }}
          GROUPS_JSON: ${{ steps.plan.outputs.groups }}
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess
          repo, sha = os.environ['REPO'], os.environ['SHA']
          def gh(path):
              return json.loads(subprocess.run(['gh', 'api', path], capture_output=True, text=True, check=True).stdout)
          def git(*args):
              done = subprocess.run(['git', *args], capture_output=True, text=True)
              return done.stdout.strip() if done.returncode == 0 else None
          out = open(os.environ['GITHUB_OUTPUT'], 'a')
          summary = open(os.environ['GITHUB_STEP_SUMMARY'], 'a')
          def emit(**values):
              for key, value in values.items():
                  out.write(f'{key}={value}\n')
          all_legs = json.loads(os.environ['MATRIX'])
          all_groups = json.loads(os.environ['GROUPS_JSON'])
          blob = lambda ref: gh(f'repos/{repo}/contents/.github/workflows/ci.yml?ref={ref}')['sha']
          tree = git('rev-parse', sha + '^{tree}')
          me = blob(os.environ['WORKFLOW_SHA'])
          ok = {}   # job name -> run id, the newest success
          for number in (1, 2, 3):
              for run in gh(f'repos/{repo}/actions/workflows/ci.yml/runs?event=workflow_dispatch&per_page=100&page={number}')['workflow_runs']:
                  m = re.fullmatch(r'CI pr ([0-9a-f]{40})', run.get('display_title') or '')
                  if not m or run['status'] != 'completed' or run['path'].split('@')[0] != '.github/workflows/ci.yml':
                      continue
                  if (run.get('head_repository') or {}).get('full_name') != repo or run['head_branch'] != 'main':
                      continue
                  if tree is None or git('rev-parse', m[1] + '^{tree}') != tree or blob(run['head_sha']) != me:
                      continue
                  for job in gh(f"repos/{repo}/actions/runs/{run['id']}/jobs?per_page=100")['jobs']:
                      if job['conclusion'] == 'success' and run['id'] > ok.get(job['name'], 0):
                          ok[job['name']] = run['id']
          agent = ['desktop-agent (ubuntu-24.04, linux-x86_64, screens)', 'desktop-agent (ubuntu-24.04, linux-x86_64, web)',
                   'desktop-agent (ubuntu-24.04-arm, linux-aarch64)', 'desktop-agent (windows-latest, windows-x86_64)',
                   'desktop-agent (macos-latest, macos-universal)']
          whole = {'shells': ['browser-shells'], 'direct_tls': ['direct-tls'], 'fedora': ['installer-fedora (43)', 'installer-fedora (44)'],
                   'windows': ['windows'], 'desktop_agent': agent, 'network_bench': ['network-bench'], 'android': ['android-build'],
                   'client_link': ['client-link']}
          reused = {}
          flags = {key: 'false' if all(n in ok for n in names) else 'true' for key, names in whole.items()}
          for key, names in whole.items():
              if flags[key] == 'false':
                  reused[key] = sorted({ok[n] for n in names})
          legs = [leg for leg in all_legs if f"host ({leg['os']}, {leg['python']})" not in ok]
          groups = [g for g in all_groups if f'browser-and-relay ({g})' not in ok]
          emit(host_matrix=json.dumps(legs, separators=(',', ':')), groups=json.dumps(groups, separators=(',', ':')), **flags)
          lines = ['### Reused from `CI pr` runs on the same files', '']
          lines += [f'- {name}: run {ok[name]}' for name in sorted(ok) if name.startswith(('host (', 'browser-and-relay (')) and
                    (name in {f"host ({l['os']}, {l['python']})" for l in all_legs} or name in {f'browser-and-relay ({g})' for g in all_groups})]
          lines += [f'- {key}: run {", ".join(map(str, runs))}' for key, runs in reused.items()]
          lines.append(f'Tree {tree}; this workflow file {me}.' if tree else 'No tree for this commit: nothing reused.')
          summary.write('\n'.join(lines) + '\n')
          print('\n'.join(lines))
          PY
  lint:
    needs: guard
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ${{ vars.JAUNT_SOURCE_REPO }}
          ssh-key: ${{ secrets.SOURCE_READ_KEY }}
          ref: ${{ inputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - run: npm ci
      - run: npm run prepare-web
      - run: pip install ruff==0.14.14
      - run: python scripts/check_project.py --undefined-names
  test:
    runs-on: ubuntu-latest
    needs: [plan, host, flake, flake-e2e, android-build, browser-and-relay, browser-shells, direct-tls, installer-fedora, windows, desktop-agent, network-bench, client-link]
    if: always()
    permissions: {}
    steps:
      - name: Require every planned test suite to succeed
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          GROUPS_PLANNED: ${{ needs.plan.outputs.groups != '[]' }}
          HOST_RESULT: ${{ needs.host.result }}
          FLAKE_RESULT: ${{ needs.flake.result }}
          FLAKE_PLANNED: ${{ needs.plan.outputs.flake_tests != '' }}
          FLAKE_E2E_RESULT: ${{ needs.flake-e2e.result }}
          FLAKE_E2E_PLANNED: ${{ needs.plan.outputs.flake_suites != '' && needs.plan.outputs.flake_suites != '[]' }}
          HOST_PLANNED: ${{ needs.plan.outputs.host_matrix != '[]' }}
          BROWSER_RELAY_RESULT: ${{ needs.browser-and-relay.result }}
          FEDORA_RESULT: ${{ needs.installer-fedora.result }}
          FEDORA_PLANNED: ${{ needs.plan.outputs.fedora }}
          WINDOWS_RESULT: ${{ needs.windows.result }}
          WINDOWS_PLANNED: ${{ needs.plan.outputs.windows }}
          DESKTOP_AGENT_RESULT: ${{ needs.desktop-agent.result }}
          DESKTOP_AGENT_PLANNED: ${{ needs.plan.outputs.desktop_agent }}
          BROWSER_SHELLS_RESULT: ${{ needs.browser-shells.result }}
          BROWSER_SHELLS_PLANNED: ${{ needs.plan.outputs.shells }}
          DIRECT_TLS_RESULT: ${{ needs.direct-tls.result }}
          DIRECT_TLS_PLANNED: ${{ needs.plan.outputs.direct_tls }}
          NETWORK_BENCH_RESULT: ${{ needs.network-bench.result }}
          NETWORK_BENCH_PLANNED: ${{ needs.plan.outputs.network_bench }}
          ANDROID_RESULT: ${{ needs.android-build.result }}
          ANDROID_PLANNED: ${{ needs.plan.outputs.android }}
          CLIENT_LINK_RESULT: ${{ needs.client-link.result }}
          CLIENT_LINK_PLANNED: ${{ needs.plan.outputs.client_link }}
        run: |
          # A job the plan left out is skipped; one it asked for must have succeeded (a skipped one
          # whose predecessor failed is a failure here, not a pass).
          check() { if [ "$3" = true ]; then test "$2" = success; else test "$2" = skipped; fi; }
          test "$PLAN_RESULT" = success
          check flake "$FLAKE_RESULT" "$FLAKE_PLANNED"
          check flake-e2e "$FLAKE_E2E_RESULT" "$FLAKE_E2E_PLANNED"
          check host "$HOST_RESULT" "$HOST_PLANNED"
          check browser-and-relay "$BROWSER_RELAY_RESULT" "$GROUPS_PLANNED"
          check installer-fedora "$FEDORA_RESULT" "$FEDORA_PLANNED"
          check windows "$WINDOWS_RESULT" "$WINDOWS_PLANNED"
          check desktop-agent "$DESKTOP_AGENT_RESULT" "$DESKTOP_AGENT_PLANNED"
          check browser-shells "$BROWSER_SHELLS_RESULT" "$BROWSER_SHELLS_PLANNED"
          check direct-tls "$DIRECT_TLS_RESULT" "$DIRECT_TLS_PLANNED"
          check network-bench "$NETWORK_BENCH_RESULT" "$NETWORK_BENCH_PLANNED"
          check android-build "$ANDROID_RESULT" "$ANDROID_PLANNED"
          check client-link "$CLIENT_LINK_RESULT" "$CLIENT_LINK_PLANNED"
  # A green "CI main <sha>" starts the release queue itself: GitHub starts no workflow_run for a CI
  # run that the queue dispatched with GITHUB_TOKEN, while a workflow_dispatch it may trigger. (A run
  # a person dispatched also triggers the workflow_run path; the queue's lock makes the second a no-op.)
  release:
    needs: [lint, test]
    if: inputs.kind == 'main' && success()
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Start the release queue
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run auto-release.yml --repo "$GITHUB_REPOSITORY" --ref main
  # The flake gate (scripts/flake_gate.py): the pytest tests and JS tests a change adds or edits run many times
  # with every core busy, on Linux and on macOS (where the host's tests run too); one failure fails the
  # change. The e2e suites it adds or edits are repeated the same way by a last step of the job that runs them.
  flake:
    needs: [guard, plan]
    if: needs.plan.outputs.flake_tests != ''
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ${{ vars.JAUNT_SOURCE_REPO }}
          ssh-key: ${{ secrets.SOURCE_READ_KEY }}
          ref: ${{ inputs.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - run: pip install -e . -r requirements-dev.txt
      - run: npm ci
      - run: npm run prepare-web
      - name: Repeat the changed tests under load
        env:
          TESTS: ${{ needs.plan.outputs.flake_tests }}
        run: if [ -f scripts/flake_gate.py ]; then python scripts/flake_gate.py run $TESTS; fi
  # The e2e suites a change adds or edits (scripts/flake_gate.py), one runner each, in parallel: a change that touches
  # several suites would not fit one job's time (a batch of six, repeated ten times each, did not). Each suite gets a
  # budget of ten minutes (never fewer than three runs); one it cannot repeat three times inside fifteen is reported
  # as over budget and fails the change, instead of being cancelled at the job's limit. The set-up is the browser
  # groups' (Chromium, Xvfb); direct-tls, network-bench and client-link repeat their own suites by a last step of their own jobs.
  flake-e2e:
    needs: [guard, plan]
    if: needs.plan.outputs.flake_suites != '' && needs.plan.outputs.flake_suites != '[]'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.flake_suites) }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ${{ vars.JAUNT_SOURCE_REPO }}
          ssh-key: ${{ secrets.SOURCE_READ_KEY }}
          ref: ${{ inputs.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - run: pip install -e . -r requirements-dev.txt
      - run: npm ci
      - run: npm run prepare-web
      # Ubuntu's mirror sometimes hands a large package out at 15-30 kB/s and apt waits for it (one Playwright
      # install in eight took 5 to 16 minutes, October 2026): scripts/apt_prefetch.sh downloads the packages
      # first, dropping a download below 300 kB/s for 8 s for the next mirror; apt then finds them in its archive.
      - run: printf 'Acquire::http::Timeout "30";\nAcquire::https::Timeout "30";\nAcquire::Retries "5";\n' | sudo tee /etc/apt/apt.conf.d/99-jaunt-ci
      - run: if [ -f scripts/apt_prefetch.sh ]; then bash scripts/apt_prefetch.sh --playwright; else echo 'Not in this source'; fi
      - run: python -m playwright install --with-deps chromium
      - name: Repeat the changed suite under load
        env:
          SUITE: ${{ matrix.suite }}
          BUDGET: '600'
          HARD: '900'
        run: if [ -f scripts/flake_gate.py ]; then python scripts/flake_gate.py run "$SUITE"; fi
  # A red `CI main <sha>` says which merge most likely broke main (scripts/ci_report.py): the run's
  # failed jobs, the last green commit of main, the merges since with their own CI main results.
  # Reporting only: nothing is rerun, and no other job waits for it.
  report:
    needs: [lint, test]
    if: always() && inputs.kind == 'main' && (needs.lint.result != 'success' || needs.test.result != 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ${{ vars.JAUNT_SOURCE_REPO }}
          ssh-key: ${{ secrets.SOURCE_READ_KEY }}
          ref: ${{ inputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Name the merge that broke main
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ inputs.sha }}
          RUN_ID: ${{ github.run_id }}
        run: if [ -f scripts/ci_report.py ]; then python3 scripts/ci_report.py --sha "$SHA" --run "$RUN_ID"; else echo 'Not in this source'; fi
  # The Android app, built as a release builds it but unsigned (android.yml builds, signs and publishes at release
  # time, and nothing built it before: a broken build, or a missing native library, would show only there and
  # block the release). Unit tests, lint, the release and debug builds. The native link (client/link, Rust through
  # JNI) is built by Gradle with the NDK: android/ci_native.sh, the script android.yml runs too, installs the NDK
  # and the Rust targets; here it is built for arm64-v8a and armeabi-v7a only (the release also builds x86_64), and
  # the release APK is required to hold a library for each of the two.
  android-build:
    needs: [guard, plan]
    if: needs.plan.outputs.android == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ${{ vars.JAUNT_SOURCE_REPO }}
          ssh-key: ${{ secrets.SOURCE_READ_KEY }}
          ref: ${{ inputs.sha }}
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          packages: platform-tools
      - run: sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0'
      - name: The NDK and the Rust targets of the native link, when the source has one
        run: if [ -f android/ci_native.sh ]; then bash android/ci_native.sh; else echo 'No native link in this source'; fi
      # The bundled web configuration names no relay: devices get it from a host's pairing code.
      - run: npm ci && npm run prepare-web
      - name: Unit tests, lint, release (unsigned) and debug builds
        run: android/gradlew -p android -PnativeAbis=arm64-v8a,armeabi-v7a :app:testDebugUnitTest :app:lintDebug :app:lintRelease :app:assembleRelease :app:assembleDebug :app:assembleDebugAndroidTest --no-daemon
      - name: A native library for each ABI in the APK
        run: |
          # Unsigned: Gradle names it app-release-unsigned.apk, or app-release.apk if it ever finds a key.
          apk=$(ls android/app/build/outputs/apk/release/app-release*.apk | head -n 1)
          test -s "$apk"
          if grep -q cargoBuild android/app/build.gradle; then
            for abi in arm64-v8a armeabi-v7a; do
              unzip -l "$apk" | grep -q " lib/$abi/libjaunt_link.so" || { echo "::error::no libjaunt_link.so for $abi in the release APK"; exit 1; }
            done
          fi
  installer-fedora:
    needs: [guard, plan]
    if: needs.plan.outputs.fedora == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      matrix:
        fedora: ['43', '44']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ${{ vars.JAUNT_SOURCE_REPO }}
          ssh-key: ${{ secrets.SOURCE_READ_KEY }}
          ref: ${{ inputs.sha }}
          persist-credentials: false
      - name: Install the candidate release with the candidate installer on Fedora, from a copy of the site
        env:
          FEDORA_VERSION: ${{ matrix.fedora }}
        run: |
          # The site and the release served here (tests/release_site.py): nothing changes while the
          # test runs, and the installed release must be exactly the one announced.
          if [ -f tests/installer_fedora_e2e.py ]; then
            python3 tests/installer_fedora_e2e.py --fedora "$FEDORA_VERSION"
            exit 0
          fi
          # A source from before tests/installer_fedora_e2e.py (the release queue tests older merges
          # with this workflow): the public release from the live site, as it used to.
          docker run --rm -v "$PWD:/src:ro" \
            -e jaunt_NO_SERVICE=1 -e jaunt_SKIP_PAIR=1 -e jaunt_RELAY_URL=wss://relay.invalid \
            "fedora:$FEDORA_VERSION" bash -c '
              set -euo pipefail
              cat /etc/fedora-release
              # The release the site announces before the install: one may be published meanwhile
              # (scripts/installed_release.py accepts that one or this one, or the one a CDN edge
              # still caches, nothing else). Pages fetches retry for up to 2 min: a release redeploys it.
              curl -fsS --retry 10 --retry-delay 5 --retry-all-errors --retry-max-time 120 --connect-timeout 10 --max-time 30 -o /var/tmp/config-before.json https://moukrea.github.io/jaunt/config.json
              cat /src/install.sh | bash
              # A source from before scripts/installed_release.py (the release queue tests older merges with
              # this workflow) checks the release announced after the install, as it used to.
              if [ -f /src/scripts/installed_release.py ]; then
                /root/.local/share/jaunt/runtime/current/bin/python /src/scripts/installed_release.py --before /var/tmp/config-before.json
              else
                curl -fsS --retry 10 --retry-delay 5 --retry-all-errors --retry-max-time 120 --connect-timeout 10 --max-time 30 -o /var/tmp/config-after.json https://moukrea.github.io/jaunt/config.json
                expected=$(/root/.local/share/jaunt/runtime/current/bin/python -c "import json; print(json.load(open(\"/var/tmp/config-after.json\"))[\"release\"])")
                /root/.local/share/jaunt/runtime/current/bin/python -c "import json; from pathlib import Path; assert json.loads((Path.home()/\".local/share/jaunt/installation.json\").read_text())[\"tag\"] == \"$expected\""
              fi
              /root/.local/bin/jaunt --version
              /root/.local/bin/jaunt stop
            '
      - name: The public release from the live site (report only, never gating)
