      - run: pip install -e . -r requirements-dev.txt
      - run: npm ci
      - run: npm run prepare-web
      - run: if [ -f client/link/Cargo.toml ]; then cargo test -p jaunt-link --locked; else echo 'Not in this source'; fi
      - run: if [ -f tests/native_link_e2e.py ]; then python tests/native_link_e2e.py; else echo 'Not in this source'; fi
      - name: Flake gate for the suites this change adds or edits
        if: contains(needs.plan.outputs.flake_e2e, '"client_link":')
        env:
          SUITES: ${{ join(fromJSON(needs.plan.outputs.flake_e2e)['client_link'], ' ') }}
        run: if [ -f scripts/flake_gate.py ] && [ -n "$SUITES" ]; then python scripts/flake_gate.py run $SUITES; fi
  # The network bench (tests/net_bench.py): simulated networks in network namespaces (NATs, a network
  # that lets out only TCP 443, a router running miniupnpd), a real host, the test relay and Chromium;
  # which stage the direct link takes on each. Runs only where the source has it.
      # The e2e suites this change adds or edits, repeated under load (scripts/flake_gate.py): the same
      # environment as their normal run above. The step runs only when the plan names this job (an empty
      # output, from a source whose plan script predates the gate, or `{}`, names none: fromJSON of an empty
      # string is an error that fails the job).
      - name: Flake gate for the suites this change adds or edits
        if: contains(needs.plan.outputs.flake_e2e, '"direct_tls":')
        env:
          SUITES: ${{ join(fromJSON(needs.plan.outputs.flake_e2e)['direct_tls'], ' ') }}
        run: if [ -f scripts/flake_gate.py ] && [ -n "$SUITES" ]; then python scripts/flake_gate.py run $SUITES; fi
  network-bench:
    needs: [guard, plan]
    if: needs.plan.outputs.network_bench == 'true'
    timeout-minutes: 30
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ${{ vars.JAUNT_SOURCE_REPO }}
          ssh-key: ${{ secrets.SOURCE_READ_KEY }}
          ref: ${{ inputs.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - run: pip install -e . -r requirements-dev.txt
      - run: npm ci
      - run: npm run prepare-web
      # Ubuntu's mirror sometimes hands a large package out at 15-30 kB/s and apt waits for it (one Playwright
      # install in eight took 5 to 16 minutes, October 2026): scripts/apt_prefetch.sh downloads the packages
      # first, dropping a download below 300 kB/s for 8 s for the next mirror; apt then finds them in its archive.
      - run: printf 'Acquire::http::Timeout "30";\nAcquire::https::Timeout "30";\nAcquire::Retries "5";\n' | sudo tee /etc/apt/apt.conf.d/99-jaunt-ci
      - run: if [ -f scripts/apt_prefetch.sh ]; then bash scripts/apt_prefetch.sh --playwright; else echo 'Not in this source'; fi
      - run: python -m playwright install --with-deps chromium
      # nft, miniupnpd for the bench's router and coturn for its TURN server (stage 4) only: never started
      # as services on the runner's own network (policy-rc.d refuses every service start during the install).
      - name: Network tools for the bench
        run: |
          printf '#!/bin/sh\nexit 101\n' | sudo tee /usr/sbin/policy-rc.d >/dev/null
          sudo chmod 755 /usr/sbin/policy-rc.d
          if [ -f scripts/apt_prefetch.sh ]; then bash scripts/apt_prefetch.sh nftables miniupnpd-nftables libnss3-tools coturn; fi
          sudo apt-get update -q
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -q --no-install-recommends nftables miniupnpd-nftables libnss3-tools coturn
          sudo rm -f /usr/sbin/policy-rc.d
          if systemctl is-active --quiet miniupnpd; then sudo systemctl stop miniupnpd; fi
          if systemctl is-active --quiet coturn; then sudo systemctl stop coturn; fi
      # Ubuntu 24.04 restricts unprivileged user namespaces through AppArmor; the bench needs one
      # (it runs unprivileged inside it, as on a workstation).
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: if [ -f tests/net_bench.py ]; then python tests/net_bench.py; else echo 'Not in this source'; fi
        env:
          JAUNT_NETBENCH_REQUIRED: '1'
          JAUNT_NETBENCH_COTURN: required
      # Electron downloads its binary on first start; the bench starts the app inside a network namespace that has no
      # route to the internet, so fetch it here first.
      - run: node node_modules/electron/install.js
      # A phone on a mobile network: fetches of every kind (gzip with a Content-Length, Range, 16 MB files) over a link that is
      # cut for 12 s (a cell handover) all succeed. It shapes the link with tc in a user and network namespace, like the bench above.
      - run: if [ -f tests/web_bench.py ]; then JAUNT_BENCH_STRESS=2 xvfb-run -a python tests/web_bench.py; else echo 'Not in this source'; fi
        timeout-minutes: 10
        env:
          JAUNT_BENCH_REQUIRED: '1'
      # The e2e suites this change adds or edits, repeated under load (scripts/flake_gate.py): the same
      # environment as their normal run above. The step runs only when the plan names this job (an empty
      # output, from a source whose plan script predates the gate, or `{}`, names none: fromJSON of an empty
      # string is an error that fails the job).
      - name: Flake gate for the suites this change adds or edits
        if: contains(needs.plan.outputs.flake_e2e, '"network_bench":')
        env:
          SUITES: ${{ join(fromJSON(needs.plan.outputs.flake_e2e)['network_bench'], ' ') }}
        run: if [ -f scripts/flake_gate.py ] && [ -n "$SUITES" ]; then python scripts/flake_gate.py run $SUITES; fi
  browser-and-relay:
    # The real browser, desktop and installer suites, in four groups on four runners at once: in one
    # job they took 32 to 42 minutes (main runs of 2026-10-21 to 26), the critical path of the whole
    # run. Each group took about 8 minutes of suites then (medians of those runs): terminal (the
    # terminal, workspaces, the relay's own tests), rich (the rich view), agents (agents, artifacts,
    # scale, Android), lifecycle (direct links, the host's lifecycle, the installer and its release). A
    # suite added here goes to the group it belongs with; check the groups' times now and then.
    needs: [guard, plan]
    if: needs.plan.outputs.groups != '[]'
    timeout-minutes: 30
